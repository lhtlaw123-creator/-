  const [aiNote, setAiNote] = useState("");

  useEffect(() => { const t = setTimeout(() => setShow(true), 10); return () => clearTimeout(t); }, []);
  const close = () => { onClose(); };

  useEffect(() => {
    const g = gatherReport(state, mode, anchor);
    setGathered(g);
    setRows(buildGoalRows(state, g));
    setStep("goals"); setAnalysis(null);
  }, [mode]);

  // 保存目标到 state（持久）
  const persistRows = (next) => {
    setRows(next);
    setState((s) => {
      const store = { ...(s[gathered.store] || {}) };
      store[gathered.key] = next;
      return { ...s, [gathered.store]: store };
    });
  };
  const updateRow = (id, r) => persistRows(rows.map((x) => (x.id === id ? r : x)));
  const removeRow = (id) => persistRows(rows.filter((x) => x.id !== id));
  const addRow = () => {
    const used = rows.map((r) => r.subjectId).filter(Boolean);
    const s = state.subjects.find((x) => !used.includes(x.id));
    persistRows([...rows, s
      ? { id: Dr.uid("g"), subjectId: s.id, name: s.name, totalHours: 10, subItems: [] }
      : { id: Dr.uid("g"), subjectId: null, name: "", totalHours: 10, subItems: [] }]);
  };

  const runAnalysis = async () => {
    setStep("loading");
    let result = null, note = "";
    if (Dr.aiAvailable(state)) {
      try {
        const raw = await Dr.aiComplete(buildReportPrompt(rows, gathered.map, gathered.days, gathered.label, gathered.from, gathered.to), state.settings, "analysis");
        result = window.parseJSONLoose(raw);
        if (!result || !result.subjects) { result = null; note = "AI 返回异常，已用本地分析。"; }
      } catch (e) { note = "AI 暂不可用（" + String(e.message || e).slice(0, 40) + "），已用本地分析。"; }
    } else {
      note = "未接入 AI（设置里填 API Key 即可启用），当前为本地智能分析。";
    }
    if (!result) result = localAnalyze(rows, gathered.map, gathered.days, gathered.label);
    setAnalysis(result); setAiNote(note); setStep("report");
  };

  const [exporting, setExporting] = useState(false);
  const [exportErr, setExportErr] = useState("");

  const exportWord = async () => {
    if (!analysis || exporting) return;
    setExporting(true); setExportErr("");
    let deepAnalysis = null;
    // 触发 AI 深度分析（使用同一模型）
    if (Dr.aiAvailable(state)) {
      try {
        const deepRaw = await Dr.aiComplete(buildDeepReportPrompt(rows, gathered.map, gathered.days, gathered.label, gathered.from, gathered.to), state.settings, "analysis");
        deepAnalysis = window.parseJSONLoose(deepRaw);
        if (!deepAnalysis || !deepAnalysis.subjects) deepAnalysis = null;
      } catch (e) {
        setExportErr("AI 深度分析失败，使用基础报告导出。");
      }
    }
    if (!deepAnalysis) deepAnalysis = analysis;
    const wordHTML = generateWordHTML(deepAnalysis, rows, state, gathered, totDone, totTarget, activeDays);
    // 以 Word 格式下载
    const blob = new Blob(['﻿' + wordHTML], { type: 'application/msword;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '备考日历_' + gathered.label + '学习分析报告_' + gathered.from + '_' + gathered.to + '.doc';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
    setExporting(false);
    toast && toast('报告已导出为 Word 文档（.doc），可用 Microsoft Word 或 WPS 打开');
  };

  const usedSubjectIds = rows.map((r) => r.subjectId).filter(Boolean);
  const activeDays = gathered.days.filter((d) => d.done > 0).length;
  const totTarget = rows.reduce((a, r) => a + (r.totalHours || subItemTarget(r) || 0), 0);
  const totDone = rows.reduce((a, r) => a + ((r.subItems && r.subItems.length) ? subItemDone(r) : realFor(gathered.map, r).doneMin / 60), 0);

  return (
    <React.Fragment>
      <div className={"scrim" + (show ? " show" : "")} onClick={close} />
      <div className={"modal" + (show ? " show" : "")} style={{ width: 860 }}>
        <div className="modal-head no-print">
          <Icon name="book" size={20} />
          <div className="modal-title">学习分析报告</div>
          <div className="cycle-seg" style={{ marginLeft: 8 }}>
            <button className={mode === "week" ? "on" : ""} onClick={() => setMode("week")}>周报</button>
            <button className={mode === "month" ? "on" : ""} onClick={() => setMode("month")}>月报</button>
          </div>
          <div className="spacer" />
          {step === "report" && <button className="btn btn-ghost" onClick={() => onOpenAI && onOpenAI(analysis)}><Icon name="flame" size={15} /> 与AI对话</button>}
          {step === "report" && <button className="btn btn-soft" onClick={exportWord} disabled={exporting}><Icon name="download" size={15} /> {exporting ? "生成中…" : "导出 Word"}</button>}
          {step === "report" && <button className="btn btn-ghost" onClick={() => setStep("goals")}><Icon name="target" size={15} /> 改目标</button>}
          <button className="icon-btn" onClick={close} title="关闭侧边栏"><Icon name="close" /></button>
        </div>

        <div className="modal-body">
          {step === "goals" && (
            <div className="no-print">
              <p style={{ fontSize: 13.5, color: "var(--ink-2)", lineHeight: 1.6, margin: "0 0 6px" }}>
                生成{gathered.label}报告前，先设定<b>目标</b>：每个科目设一个总目标，再<b>拆成几个子项</b>分别填目标时长与已完成（AI 会逐项分析）。科目可自由增删改。
              </p>
              <div style={{ fontSize: 12, color: "var(--ink-3)", marginBottom: 14 }}>{gathered.from} 至 {gathered.to} · 设定会自动保存</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {rows.map((r) => (
                  <GoalRow key={r.id} row={r} subjects={state.subjects} usedSubjectIds={usedSubjectIds}
                    realDone={realFor(gathered.map, r).doneMin / 60}
                    onChange={(nr) => updateRow(r.id, nr)} onRemove={() => removeRow(r.id)} />
                ))}
              </div>
              <button className="btn btn-soft" style={{ marginTop: 14 }} onClick={addRow}><Icon name="plus" size={15} /> 添加科目</button>
            </div>
          )}

          {step === "loading" && (
            <div style={{ textAlign: "center", padding: "60px 0" }}>
              <div className="ai-typing" style={{ justifyContent: "center", marginBottom: 16 }}><i /><i /><i /></div>
              <div style={{ color: "var(--ink-2)", fontSize: 14 }}>AI 正在逐项分析你的{gathered.label}学习数据…</div>
            </div>
          )}

          {exporting && (
            <div className="rep-exporting">
              <div className="ai-typing" style={{ justifyContent: "center", marginBottom: 16 }}><i /><i /><i /></div>
              <p>AI 正在逐科撰写正式分析报告…</p>
              <p style={{ fontSize: 12, color: "var(--ink-3)" }}>报告将导出为 Word 文档（.doc），采用国标公文格式</p>
            </div>
          )}

          {step === "report" && analysis && !exporting && (
            <div className="report-sheet">
              <div className="rep-header">
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="rep-kicker">备考日历 · {gathered.label}学习分析报告</div>
                  <div className="rep-title font-display">{analysis.headline}</div>
                  <div className="rep-range tnum">{gathered.from} 至 {gathered.to}</div>
                </div>
                <div className="rep-score">
                  <Ring value={(analysis.score || 0) / 100} size={92} stroke={10} glow
                    color={analysis.score >= 75 ? "oklch(0.72 0.16 150)" : analysis.score >= 50 ? "var(--accent)" : "oklch(0.7 0.16 30)"}>
                    <div><div className="font-display tnum" style={{ fontSize: 28, fontWeight: 700, lineHeight: 1 }}>{analysis.score}</div><div style={{ fontSize: 10, color: "var(--ink-2)" }}>表现分</div></div>
                  </Ring>
                </div>
              </div>

              <div className="rep-kpis">
                <div><b className="font-display tnum">{totDone.toFixed(1)}h</b><span>已完成时长</span></div>
                <div><b className="font-display tnum">{totTarget.toFixed(0)}h</b><span>目标合计</span></div>
                <div><b className="font-display tnum">{totTarget ? Math.round(Math.min(1, totDone / totTarget) * 100) : 0}%</b><span>目标达成率</span></div>
                <div><b className="font-display tnum">{activeDays}/{gathered.days.length}</b><span>有效学习天</span></div>
              </div>

              {/* 可视化：每日学习时长图 */}
              <div className="rep-section">
                <h4>每日学习时长</h4>
                <div className="rep-daily-chart">
                  {gathered.days.map((d) => {
                    const hrs = d.done / 60;
                    const maxH = Math.max(1, ...gathered.days.map((x) => x.done / 60));
                    const h = Math.max(1, Math.round((hrs / maxH) * 80));
                    const color = hrs > 4 ? "var(--accent)" : hrs > 1 ? "oklch(0.72 0.13 190)" : "var(--line)";
                    return (
                      <div key={d.date} className="rep-daily-bar" style={{ height: h + "px", background: color }}
                        title={d.date.slice(5) + ": " + hrs.toFixed(1) + "h"}>
                        <div className="rep-daily-val">{hrs.toFixed(1)}h</div>
                        <div className="rep-daily-label">{d.date.slice(8)}日</div>
                      </div>
                    );
                  })}
                </div>
                <div style={{ fontSize: 10.5, color: "var(--ink-3)", textAlign: "center", marginTop: 24 }}>
                  每日实际学习时长（深色=时长长，浅色=时长短）
                </div>
              </div>

              {/* 可视化：科目时间分配 */}
              <div className="rep-section">
                <h4>科目时间分配对比</h4>
                <div className="rep-compare">
                  {rows.map((r) => {
                    const subj = r.subjectId ? state.subjects.find((s) => s.id === r.subjectId) : null;
                    const color = subj ? subj.solid : "var(--ink-3)";
                    const target = r.totalHours || subItemTarget(r) || 0;
                    const done = (r.subItems && r.subItems.length) ? subItemDone(r) : realFor(gathered.map, r).doneMin / 60;
                    const ratio = target ? Math.min(1, done / target) : 0;
                    const maxW = Math.max(target, ...rows.map((x) => x.totalHours || subItemTarget(x) || 1));
                    const doneW = Math.max(2, (done / maxW) * 100);
                    const goalW = Math.max(2, ((target - done) / maxW) * 100);
                    return (
                      <div className="rep-compare-row" key={r.id}>
                        <div className="rep-compare-label" style={{ color }}>{r.name || "—"}</div>
                        <div className="rep-compare-track">
                          <div className="rep-compare-done" style={{ width: doneW + "%", background: color }}>
                            {done >= target * 0.1 ? done.toFixed(0) + "h" : ""}
                          </div>
                          {goalW > 0 && <div className="rep-compare-goal" style={{ width: goalW + "%", background: color }} />}
                        </div>
                        <div className="rep-compare-fig">{done.toFixed(1)}/{target.toFixed(0)}h</div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="rep-section"><h4>整体概览</h4><p>{analysis.overall}</p></div>

              <div className="rep-section">
                <h4>各科目 · 目标拆解与逐项分析</h4>
                {rows.map((r) => {
                  const subj = r.subjectId ? state.subjects.find((s) => s.id === r.subjectId) : null;
                  const color = subj ? subj.solid : "var(--ink-3)";
                  const line = subj ? subj.line : "var(--line)";
                  const ai = (analysis.subjects || []).find((x) => x.name === r.name || (x.name && r.name.includes(x.name)));
                  const target = r.totalHours || subItemTarget(r);
                  const done = (r.subItems && r.subItems.length) ? subItemDone(r) : realFor(gathered.map, r).doneMin / 60;
                  const ratio = target ? Math.min(1, done / target) : 0;
                  return (
                    <div className="rep-subj" key={r.id}>
                      <div className="rep-subj-top">
                        <span className="subj-dot" style={{ background: color }} /><b>{r.name || "未命名"}</b>
                        <span className="rep-subj-fig tnum">{done.toFixed(1)}h / 目标 {target || "—"}h · {Math.round(ratio * 100)}%</span>
                      </div>
                      <div className="sbar" style={{ margin: "4px 0 6px" }}>
                        <i style={{ width: `100%`, background: line, opacity: 0.4 }} />
                        <i style={{ width: `${ratio * 100}%`, background: color, marginTop: -9 }} />
                      </div>
                      {ai && ai.comment && <p className="rep-subj-comment">{ai.comment}</p>}
                      {(r.subItems || []).length > 0 && (
                        <div className="rep-subitems">
                          {r.subItems.map((si) => {
                            const sr = si.hours ? Math.min(1, (+si.done || 0) / si.hours) : 0;
                            const sai = ai && ai.subItems && ai.subItems.find((x) => x.name === si.name || (x.name && si.name.includes(x.name)));
                            return (
                              <div className="rep-subitem" key={si.id}>
                                <span className="rep-si-name">{si.name}</span>
                                <div className="rep-si-bar"><i style={{ width: `${sr * 100}%`, background: color }} /></div>
                                <span className="rep-si-fig tnum">{si.done || 0}/{si.hours}h</span>
                                <span className="rep-si-pct tnum" style={{ color: sr >= 1 ? "oklch(0.6 0.15 150)" : "var(--ink-2)" }}>{Math.round(sr * 100)}%</span>
                                {sai && <span className="rep-si-comment">· {sai.comment}</span>}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              <div className="rep-cols">
                <div className="rep-section"><h4>✦ 亮点</h4><ul>{(analysis.wins || []).map((w, i) => <li key={i}>{w}</li>)}</ul></div>
                <div className="rep-section"><h4>⚠ 风险 / 落后</h4><ul>{(analysis.risks || []).map((w, i) => <li key={i}>{w}</li>)}</ul></div>
              </div>

              <div className="rep-section rep-suggest"><h4>下阶段建议</h4><ol>{(analysis.suggestions || []).map((w, i) => <li key={i}>{w}</li>)}</ol></div>
              <div className="rep-foot">由 备考日历 生成{aiNote ? " · " + aiNote : " · AI 智能分析"} · {Dr.today()}</div>
            </div>
          )}
        </div>

        {step === "goals" && (
          <div className="drawer-foot no-print" style={{ borderTop: "1px solid var(--line)" }}>
            <span style={{ fontSize: 12, color: "var(--ink-3)" }}>目标合计 {totTarget.toFixed(0)}h · {rows.length} 个科目</span>
            <div className="spacer" />
            <button className="btn btn-soft" onClick={close}>取消</button>
            <button className="btn btn-accent" onClick={runAnalysis} disabled={!rows.length}>
              <Icon name="chart" size={15} /> 生成分析报告
            </button>
          </div>
        )}
      </div>
    </React.Fragment>
  );
}

window.ReportModal = ReportModal;

</script>
  <script type="text/babel">
/* ============ 备考日历 · 主应用 ============ */
const Da = window.CalData;

function useToast() {
  const [msg, setMsg] = useState(null);
  const show = useCallback((m) => {
    setMsg(m);
    clearTimeout(show._t);
    show._t = setTimeout(() => setMsg(null), 2200);
  }, []);
  const node = <div className={"pill-toast" + (msg ? " show" : "")}>{msg}</div>;
  return [show, node];
}

function SettingsDrawer({ settings, onSave, onClose, onReset, onExport, onExportBackup, onImportBackup, cloudEnabled, syncStatus, onConnectCloud, onDisconnectCloud, onSyncNow }) {
  const isAdminUser = Da.isAdmin();
  const [show, setShow] = useState(false);
  const [d, setD] = useState(settings);
  const [tokenInput, setTokenInput] = useState("");
  // 修改密码
  const [pwOld, setPwOld] = useState("");
  const [pwNew, setPwNew] = useState("");
  const [pwNew2, setPwNew2] = useState("");
  const [pwBusy, setPwBusy] = useState(false);
  const [pwMsg, setPwMsg] = useState("");
  const [pwOk, setPwOk] = useState(false);

  const doChangePw = async () => {
    setPwMsg(""); setPwOk(false);
    if (!pwOld) { setPwMsg("请输入当前密码"); return; }
    if (!pwNew || pwNew.length < 6) { setPwMsg("新密码至少6位"); return; }
    if (pwNew !== pwNew2) { setPwMsg("两次新密码不一致"); return; }
    setPwBusy(true);
    try {
      const ok = await Da.changePassword(pwOld, pwNew);
      if (ok) {
        setPwMsg("密码已修改，云端同步后其他设备可用新密码登录");
        setPwOk(true);
        setPwOld(""); setPwNew(""); setPwNew2("");
      } else {
        setPwMsg("当前密码错误");
      }
    } catch (e) {
      setPwMsg("修改失败：" + (e.message || e));
    }
    setPwBusy(false);
  };
  const fileRef = useRef(null);
  useEffect(() => { const t = setTimeout(() => setShow(true), 10); return () => clearTimeout(t); }, []);
  const close = () => { setShow(false); setTimeout(onClose, 300); };
  const patch = (p) => setD((x) => ({ ...x, ...p }));
  const save = () => { onSave(d); close(); };

  const AI_PROVIDERS = [["auto", "自动"], ["deepseek", "DeepSeek"], ["openai", "OpenAI"], ["kimi", "Kimi"], ["anthropic", "Claude"], ["custom", "自定义"]];
  const inClaude = !!(typeof window !== "undefined" && window.claude && window.claude.complete);
  const prov = d.aiProvider || "auto";
  const preset = Da.AI_PRESETS[prov === "auto" ? "anthropic" : prov] || Da.AI_PRESETS.anthropic;
  const needKey = !(prov === "auto" && inClaude);
  const aiStatus = (prov === "auto" && inClaude)
    ? "✓ 当前在 Claude 环境，AI 已可用"
    : (d.apiKey ? "✓ 已配置 Key，AI 可用" : "未填写 Key：AI 排课不可用，报告会用本地分析");

  return (
    <React.Fragment>
      <div className={"scrim" + (show ? " show" : "")} onClick={save} />
      <div className={"drawer" + (show ? " show" : "")} style={{ width: 400 }}>
        <div className="drawer-head">
          <Icon name="gear" size={20} style={{ marginTop: 4 }} />
          <div className="font-display" style={{ fontSize: 20, fontWeight: 700, flex: 1 }}>设置</div>
          <button className="icon-btn" onClick={save}><Icon name="close" /></button>
        </div>
        <div className="drawer-body">
          <div className="field">
            <label className="field-label">每日学习目标 · {Da.fmtMin(d.dailyGoalMin)}</label>
            <input type="range" min="60" max="720" step="30" value={d.dailyGoalMin}
              style={{ width: "100%", accentColor: "var(--accent)" }}
              onChange={(e) => patch({ dailyGoalMin: +e.target.value })} />
            <div className="dur-quick">
              {[180, 240, 300, 360, 480].map((m) => (
                <button key={m} className={d.dailyGoalMin === m ? "on" : ""} onClick={() => patch({ dailyGoalMin: m })}>{Da.fmtMin(m)}</button>
              ))}
            </div>
          </div>
          <div style={{ height: 1, background: "var(--line)", margin: "20px 0" }} />
          <div className="field">
            <label className="field-label">AI 助手 · 服务商 {!isAdminUser && <span style={{fontSize:11,color:"var(--ink-3)",fontWeight:400}}>（仅管理员）</span>}</label>
            {isAdminUser ? (
              <React.Fragment>
            <div style={{ background: "var(--bg-soft)", borderRadius: "var(--r-md)", padding: "10px 13px", marginBottom: 12, display: "flex", alignItems: "center", gap: 9 }}>
              <span style={{ width: 8, height: 8, borderRadius: 99, background: (prov === "auto" && inClaude) || d.apiKey ? "oklch(0.7 0.16 150)" : "var(--ink-3)", flexShrink: 0 }} />
              <span style={{ fontSize: 13, fontWeight: 600, color: "var(--ink)" }}>
                {aiStatus}
              </span>
            </div>
            <p style={{ fontSize: 12.5, color: "var(--ink-2)", lineHeight: 1.6, margin: "0 0 10px" }}>
              当前运行：<b>{prov === "auto" ? (inClaude ? "Claude (自动)" : "未检测到 Claude") : preset.label}</b>{d.aiModel ? " · 模型：" + d.aiModel : (prov === "deepseek" ? " · 对话/分析：" + (preset.chatModel || "flash") + " / " + (preset.analysisModel || "pro") : " · 模型：" + preset.model)}
            </p>
            <p style={{ fontSize: 12.5, color: "var(--ink-2)", lineHeight: 1.6, margin: "0 0 10px" }}>
              在 Claude 里使用选「自动」即可，无需填 Key。<b>脱离 Claude（自己的网站 / Mac App）</b>时，选一个服务商并填入对应 API Key（仅存本机，不上传）。
            </p>
            <div className="dur-quick" style={{ flexWrap: "wrap", marginBottom: 10 }}>
              {AI_PROVIDERS.map(([val, label]) => (
                <button key={val} className={prov === val ? "on" : ""} onClick={() => patch({ aiProvider: val })}>{label}</button>
              ))}
            </div>
            {needKey && (
              <React.Fragment>
                <input className="input" type="password" value={d.apiKey || ""} placeholder={preset.keyHint} autoComplete="off"
                  onChange={(e) => patch({ apiKey: e.target.value.trim() })} style={{ marginBottom: 8 }} />
                {prov === "custom" && (
                  <input className="input" type="text" value={d.aiBaseUrl || ""} placeholder="接口地址，如 https://api.xxx.com/v1" autoComplete="off"
                    onChange={(e) => patch({ aiBaseUrl: e.target.value.trim() })} style={{ marginBottom: 8 }} />
                )}
                <input className="input" type="text" value={d.aiModel || ""} placeholder={"模型名（留空用默认：" + preset.model + "）"} autoComplete="off"
                  onChange={(e) => patch({ aiModel: e.target.value.trim() })} />
                <p style={{ fontSize: 11.5, color: "var(--ink-3)", lineHeight: 1.6, margin: "8px 0 0" }}>
                  Key 获取：DeepSeek platform.deepseek.com · OpenAI platform.openai.com · Kimi platform.moonshot.cn · Claude console.anthropic.com。个别服务商可能限制浏览器直连（CORS），DeepSeek 通常可用。
                </p>
              </React.Fragment>
            )}
            <button className="btn btn-accent" onClick={save} style={{ width: "100%", justifyContent: "center", marginTop: 12 }}>
              <Icon name="check" size={15} stroke={2.6} /> 保存 AI 设置
            </button>
          </React.Fragment>
            ) : (
              <div style={{ background: "var(--bg-soft)", borderRadius: "var(--r-md)", padding: "16px", textAlign: "center" }}>
                <p style={{ fontSize: 13, color: "var(--ink-2)", margin: 0 }}>

/* ============ 云同步配置提示 ============ */
function SyncPrompt({ state, setState, connectCloud, toast, onClose }) {
  const [token, setToken] = useState("");
  const [busy, setBusy] = useState(false);

  const handleSave = async () => {
    var t = (token || "").trim();
    if (!t) { toast("请输入 GitHub Token"); return; }
    setBusy(true);
    try {
      // 先保存 token
      setState(function(s) {
        var next = { ...s, settings: { ...s.settings, syncToken: t } };
        Da.save(next);
        return next;
      });
      // 尝试连接
      await connectCloud(t);
      toast("云同步已开启");
      onClose();
    } catch(e) {
      toast("连接失败：" + (e.message || e));
    }
    setBusy(false);
  };

  const handleSkip = () => {
    toast("可随时在右上角「设置」中配置云同步");
    onClose();
  };

  return (
    <React.Fragment>
      <div className="scrim show" onClick={handleSkip} />
      <div className="modal show" style={{ width: 420 }}>
        <div className="modal-head">
          <Icon name="download" size={20} style={{ marginTop: 2 }} />
          <div className="font-display" style={{ fontSize: 20, fontWeight: 700, flex: 1 }}>配置云同步</div>
          <button className="icon-btn" onClick={handleSkip}><Icon name="close" /></button>
        </div>
        <div className="modal-body">
          <p style={{ fontSize: 13, color: "var(--ink-2)", lineHeight: 1.7, margin: "0 0 16px" }}>
            绑定 GitHub Token 后，你的日程数据会自动在多台设备间同步。<br/>Token 仅存本机，不会被上传到云端。
          </p>
          <input className="input" type="password" value={token} placeholder="粘贴 GitHub Token（ghp_...）" autoComplete="off"
            onChange={(e) => setToken(e.target.value.trim())}
            onKeyDown={(e) => { if (e.key === "Enter") handleSave(); }}
            style={{ marginBottom: 8 }} />
          <p style={{ fontSize: 11.5, color: "var(--ink-3)", lineHeight: 1.7, margin: "0 0 16px" }}>
            获取方式：GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate，勾选 <b>gist</b> 权限。
          </p>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn btn-ghost" onClick={handleSkip} style={{ flex: 1, justifyContent: "center" }}>跳过</button>
            <button className="btn btn-accent" onClick={handleSave} disabled={busy} style={{ flex: 1, justifyContent: "center" }}>
              {busy ? "连接中…" : "绑定并开启同步"}
            </button>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ============ 登录界面 ============ */
function LoginScreen({ onLogin }) {
  const [user, setUser] = useState("");
  const [pass, setPass] = useState("");
  const [pass2, setPass2] = useState("");
  const [error, setError] = useState("");
  const [mode, setMode] = useState("login"); // "login" | "register"
  const [busy, setBusy] = useState(false);

  const handleLogin = async () => {
    setBusy(true); setError("");
    try {
      const ok = await Da.doLogin(user, pass);
      if (ok) { onLogin(); } else { setError("账号或密码错误，请重试"); }
    } catch(e) { setError("登录失败：" + (e.message || e)); }
    setBusy(false);
  };

  const handleRegister = async () => {
    setError("");
    if (!user.trim()) { setError("请输入账号"); return; }
    if (pass.length < 6) { setError("密码至少6位"); return; }
    if (pass !== pass2) { setError("两次密码不一致"); return; }
    setBusy(true);
    try {
      const result = await Da.doRegister(user.trim(), pass);
      if (result === true) { onLogin(); }
      else { setError(result); }
    } catch(e) { setError("注册失败：" + (e.message || e)); }
    setBusy(false);
  };

  const switchMode = (m) => { setMode(m); setError(""); setUser(""); setPass(""); setPass2(""); };

  return (
    <div className="login-overlay">
      <div className="login-card">
        <div className="login-avatar" />
        <div className="login-title">备考日历</div>
        <div className="login-sub">规划每一天 · 看见每一分</div>
        <input className="input" type="text" value={user} placeholder="账号" autoComplete="username"
          onChange={(e) => { setUser(e.target.value); setError(""); }}
          onKeyDown={(e) => { if (e.key === "Enter") document.getElementById("login-pass").focus(); }} />
        <input id="login-pass" className="input" type="password" value={pass} placeholder="密码" autoComplete="current-password"
          onChange={(e) => { setPass(e.target.value); setError(""); }}
          onKeyDown={(e) => { if (e.key === "Enter") { if (mode === "register") { document.getElementById("login-pass2").focus(); } else { handleLogin(); } } }} />
        {mode === "register" && (
          <input id="login-pass2" className="input" type="password" value={pass2} placeholder="确认密码" autoComplete="new-password"
            onChange={(e) => { setPass2(e.target.value); setError(""); }}
            onKeyDown={(e) => { if (e.key === "Enter") handleRegister(); }} />
        )}
        <div className={"login-error" + (error ? " show" : "")}>{error}</div>
        {mode === "login" ? (
          <React.Fragment>
            <button type="button" className="login-btn" onClick={handleLogin} disabled={busy}>
              {busy ? "验证中…" : "登 录"}
            </button>
            <span className="login-toggle" onClick={() => switchMode("register")}>还没有账号？注册一个新账号</span>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <button type="button" className="login-btn" onClick={handleRegister} disabled={busy}>
              {busy ? "注册中…" : "注 册"}
            </button>
            <span className="login-toggle" onClick={() => switchMode("login")}>已有账号？返回登录</span>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}


function App() {
  const [loggedIn, setLoggedIn] = useState(() => Da.isLoggedIn());
  const [state, setState] = useState(() => {
    const s = Da.load();
    // 如果 state 中有云端同步来的密码哈希，更新本地
    if (s.settings && s.settings.passwordHash) {
      Da.setPasswordHash(s.settings.passwordHash);
    }
    return s;
  });
  const [view, setView] = useState("month"); // month | week | day
  const [anchor, setAnchor] = useState(Da.today());
  const [editing, setEditing] = useState(null); // event being edited
  const [showStats, setShowStats] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showAI, setShowAI] = useState(false);
  const [showPlanner, setShowPlanner] = useState(false);
  const [showReport, setShowReport] = useState(false);
  const [showCountdownMgr, setShowCountdownMgr] = useState(false);
  const [reviewSubject, setReviewSubject] = useState(null);
  const [collapsed, setCollapsed] = useState(false);
  const [toast, toastNode] = useToast();
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | syncing | ok | error
  const [showSyncPrompt, setShowSyncPrompt] = useState(false);
  const syncRef = useRef({ lastJson: null, timer: null, pulling: false });
  const stateRef = useRef(state); stateRef.current = state;

  const handleLogout = () => { Da.doLogout(); setLoggedIn(false); autoSyncRef.current = false; };

  // 登录后：重新加载用户数据、检查云同步配置
  const autoSyncRef = useRef(false);
  useEffect(() => {
    if (!loggedIn || autoSyncRef.current) return;
    autoSyncRef.current = true;

    // 重新加载当前用户的数据（替换登录前的 guest 数据）
    var s = Da.load();
    if (s.settings && s.settings.passwordHash) {
      Da.setPasswordHash(s.settings.passwordHash);
    }
    setState(s);
    stateRef.current = s;

    var isAdminUser = Da.isAdmin();
    var st = s;

    // 如果已经开启了云同步，拉取一下云端最新数据
    if (st.settings.syncEnabled && st.settings.syncToken && st.settings.syncGistId) {
      pullCloud();
      return;
    }
    // Admin 已配置 syncToken 但未连接，自动连接
    if (isAdminUser && st.settings.syncToken && !st.settings.syncGistId) {
      connectCloud(st.settings.syncToken);
      return;
    }
    // Admin：自动解码注入预置的云同步 Token（尚未手动配置时）
    if (isAdminUser && !st.settings.syncToken && Da.SYNC_TOKEN) {
      try {
        var decoded = atob(Da.SYNC_TOKEN);
        if (decoded && decoded.startsWith("ghp_")) {
          var nextSettings = { ...st.settings, syncToken: decoded };
          var updated = { ...st, settings: nextSettings };
          setState(updated);
          stateRef.current = updated;
          Da.save(updated);
          // 注入后自动连接云端
          setTimeout(function() { connectCloud(decoded); }, 500);
          return;
        }
      } catch(e) { /* 解码失败则走正常流程 */ }
    }
    // 未配置云同步：弹出提示让用户输入
    if (!st.settings.syncToken) {
      setTimeout(function() { setShowSyncPrompt(true); }, 600);
    }
  }, [loggedIn]);
  const cloudEnabled = !!(state.settings.syncEnabled && state.settings.syncToken && state.settings.syncGistId);

  useEffect(() => { Da.save(state); window.CalData._aiSettings = state.settings; }, [state]);

  // 云同步：内容变化后（防抖）推送到云端
  const contentKey = (st) => { const p = Da.cloudPayload(st); delete p.updatedAt; return JSON.stringify(p); };
  useEffect(() => {
    if (!cloudEnabled) { syncRef.current.lastJson = null; return; }
    const r = syncRef.current;
    if (r.pulling) return;
    const key = contentKey(state);
    if (r.lastJson === null) { r.lastJson = key; return; } // 首次建立基准，不推送
    if (key === r.lastJson) return;
    clearTimeout(r.timer);
    r.timer = setTimeout(async () => {
      try {
        setSyncStatus("syncing");
        const payload = { ...Da.cloudPayload(state), updatedAt: Date.now() };
        await Da.cloudWrite(state.settings.syncToken, state.settings.syncGistId, payload);
        r.lastJson = key;
        r.pulling = true;
        setState((s) => ({ ...s, updatedAt: payload.updatedAt }));
        setTimeout(() => { r.pulling = false; }, 0);
        setSyncStatus("ok");
      } catch (e) { setSyncStatus("error"); }
    }, 2500);
    return () => clearTimeout(r.timer);
  }, [state, cloudEnabled]);

  // 云同步：拉取云端（启用时 / 窗口重新获焦时），云端更新则采用
  const pullCloud = useCallback(async () => {
    const st = stateRef.current;
    if (!(st.settings.syncEnabled && st.settings.syncToken && st.settings.syncGistId)) return;
    try {
      setSyncStatus("syncing");
      const cloud = await Da.cloudRead(st.settings.syncToken, st.settings.syncGistId);
      if (cloud) {
        const localT = st.updatedAt || 0, cloudT = cloud.updatedAt || 0;
        if (cloudT > localT) {
          const merged = Da.mergeCloud(st, cloud);
          // 同步密码哈希到本机 localStorage
          if (merged.settings && merged.settings.passwordHash) {
            Da.setPasswordHash(merged.settings.passwordHash);
          }
          const p = Da.cloudPayload(merged); delete p.updatedAt;
          syncRef.current.lastJson = JSON.stringify(p);
          syncRef.current.pulling = true;
          setState(merged);
          setTimeout(() => { syncRef.current.pulling = false; }, 0);
        }
      }
      setSyncStatus("ok");
    } catch (e) { setSyncStatus("error"); }
  }, []);

  useEffect(() => { if (cloudEnabled) pullCloud(); }, [cloudEnabled, pullCloud]);
  useEffect(() => {
    const onFocus = () => { if (stateRef.current.settings.syncEnabled) pullCloud(); };
    window.addEventListener("focus", onFocus);
    document.addEventListener("visibilitychange", onFocus);
    return () => { window.removeEventListener("focus", onFocus); document.removeEventListener("visibilitychange", onFocus); };
  }, [pullCloud]);

  const connectCloud = async (token) => {
    token = (token || "").trim();
    if (!token) { toast("请先填入 GitHub Token"); return; }
    try {
      setSyncStatus("syncing");
      const base0 = stateRef.current;
      let gistId = await Da.cloudFindGist(token);
      const base = { ...base0, settings: { ...base0.settings, syncToken: token, syncGistId: gistId || "", syncEnabled: true } };
      if (gistId) {
        const cloud = await Da.cloudRead(token, gistId);
        if (cloud && cloud.events && cloud.events.length) {
          const useCloud = confirm("检测到云端已有日程数据。\n\n「确定」= 用云端数据覆盖本机（在新设备上请选这个）\n「取消」= 用本机数据覆盖云端");
          if (useCloud) {
            const merged = Da.mergeCloud(base, cloud);
            const p = Da.cloudPayload(merged); delete p.updatedAt;
            syncRef.current.lastJson = JSON.stringify(p);
            setState(merged);
          } else {
            const payload = { ...Da.cloudPayload(base), updatedAt: Date.now() };
            await Da.cloudWrite(token, gistId, payload);
            const p = { ...payload }; delete p.updatedAt;
            syncRef.current.lastJson = JSON.stringify(p);
            setState({ ...base, updatedAt: payload.updatedAt });
          }
        } else {
          const payload = { ...Da.cloudPayload(base), updatedAt: Date.now() };
          await Da.cloudWrite(token, gistId, payload);
          const p = { ...payload }; delete p.updatedAt;
          syncRef.current.lastJson = JSON.stringify(p);
          setState({ ...base, updatedAt: payload.updatedAt });
        }
      } else {
        const payload = { ...Da.cloudPayload(base), updatedAt: Date.now() };
        gistId = await Da.cloudCreateGist(token, payload);
        const p = { ...payload }; delete p.updatedAt;
        syncRef.current.lastJson = JSON.stringify(p);
        setState({ ...base, updatedAt: payload.updatedAt, settings: { ...base.settings, syncGistId: gistId } });
      }
      setSyncStatus("ok");
      toast("✓ 云同步已开启");
    } catch (e) { setSyncStatus("error"); toast("连接失败：" + (e.message || e)); }
  };
  const disconnectCloud = () => {
    setState((s) => ({ ...s, settings: { ...s.settings, syncEnabled: false } }));
    syncRef.current.lastJson = null; setSyncStatus("idle");
    toast("已断开云同步（云端数据保留）");
  };
  const syncNow = async () => {
    const st = stateRef.current;
    if (!st.settings.syncEnabled) return;
    try {
      setSyncStatus("syncing");
      const payload = { ...Da.cloudPayload(st), updatedAt: Date.now() };
      await Da.cloudWrite(st.settings.syncToken, st.settings.syncGistId, payload);
      const p = { ...payload }; delete p.updatedAt;
      syncRef.current.lastJson = JSON.stringify(p);
      setState((s) => ({ ...s, updatedAt: payload.updatedAt }));
      setSyncStatus("ok"); toast("已同步到云端");
    } catch (e) { setSyncStatus("error"); toast("同步失败：" + (e.message || e)); }
  };

  // 过滤隐藏科目
  const visibleEvents = useMemo(() => {
    const hid = state.settings.hiddenSubjects || [];
    return hid.length ? state.events.filter((e) => !hid.includes(e.subjectId)) : state.events;
  }, [state.events, state.settings.hiddenSubjects]);

  const upsertEvent = (ev) => {
    const clean = { ...ev };
    delete clean._exists;
    setState((s) => {
      const exists = s.events.some((e) => e.id === clean.id);
      const events = exists ? s.events.map((e) => (e.id === clean.id ? clean : e)) : [...s.events, clean];
      return { ...s, events };
    });
  };
  const deleteEvent = (id) => setState((s) => ({ ...s, events: s.events.filter((e) => e.id !== id) }));
  const patchEvent = (id, patch) => setState((s) => ({ ...s, events: s.events.map((e) => (e.id === id ? { ...e, ...patch } : e)) }));
  const toggleSubject = (id) => setState((s) => {
    const hid = new Set(s.settings.hiddenSubjects || []);
    hid.has(id) ? hid.delete(id) : hid.add(id);
    return { ...s, settings: { ...s.settings, hiddenSubjects: [...hid] } };
  });

  const newEvent = (date, start) => {
    const firstVisible = state.subjects.find((s) => !(state.settings.hiddenSubjects || []).includes(s.id)) || state.subjects[0];
    setEditing({
      id: Da.uid("e"), date: date || anchor, subjectId: firstVisible.id, title: "",
      start: start || null, durationMin: 60, done: false, notes: "", todos: [], _exists: false,
    });
  };
  const openEvent = (e) => setEditing({ ...e, _exists: true });

  // 导航
  const navStep = (dir) => {
    if (view === "month") {
      const d = Da.parseISO(Da.startOfMonth(anchor));
      d.setMonth(d.getMonth() + dir);
      setAnchor(Da.iso(d));
    } else if (view === "week") setAnchor(Da.addDays(anchor, dir * 7));
    else setAnchor(Da.addDays(anchor, dir));
  };
  const periodLabel = useMemo(() => {
    const d = Da.parseISO(anchor);
    if (view === "month") return `${d.getFullYear()} · ${Da.MONTH_CN[d.getMonth()]}`;
    if (view === "week") {
      const s = Da.startOfWeek(anchor), e = Da.addDays(s, 6);
      const sd = Da.parseISO(s), ed = Da.parseISO(e);
      return `${sd.getMonth() + 1}月${sd.getDate()}日 – ${ed.getMonth() + 1}月${ed.getDate()}日`;
    }
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 周${Da.DOW_CN[Da.dow(anchor)]}`;
  }, [view, anchor]);

  const goDay = (date) => { setAnchor(date); setView("day"); };
  const doExport = () => { Da.downloadICS(state); toast("已导出 备考日历.ics"); };
  const doExportBackup = () => { Da.exportBackup(state); toast("已导出备份文件"); };
  const doImportBackup = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const s = Da.parseBackup(reader.result);
        if (confirm("导入将覆盖当前设备上的全部数据，确定？")) { setState(s); toast("已导入备份"); }
      } catch (err) { toast("导入失败：" + (err.message || err)); }
    };
    reader.readAsText(file);
  };

  const viewProps = {
    anchor, events: visibleEvents, subjects: state.subjects, settings: state.settings,
    onEvent: openEvent, onAdd: newEvent, onDay: goDay, onPatch: patchEvent,
  };

  if (!loggedIn) {
    return <LoginScreen onLogin={() => setLoggedIn(true)} />;
  }

  return (
    <div className="app">
      <div className="topbar">
        <button className="icon-btn" onClick={() => setCollapsed((c) => !c)}><Icon name="menu" /></button>
        <div className="brand">
          <div className="brand-mark" />
          <div>
            <div className="brand-name">备考日历</div>
            <div className="brand-sub">规划每一天 · 看见每一分</div>
          </div>
        </div>

        <div className="nav-group" style={{ marginLeft: 8 }}>
          <button className="btn btn-today" onClick={() => setAnchor(Da.today())}>今天</button>
          <button className="icon-btn" onClick={() => navStep(-1)}><Icon name="prev" /></button>
          <button className="icon-btn" onClick={() => navStep(1)}><Icon name="next" /></button>
          <div className="period-label">{periodLabel}</div>
        </div>

        <div className="spacer" />

        <div className="segment">
          {[["month", "月"], ["week", "周"], ["day", "日"]].map(([k, l]) => (
            <button key={k} className={view === k ? "on" : ""} onClick={() => setView(k)}>{l}</button>
          ))}
        </div>
        <button className="icon-btn" title="每周规划" onClick={() => setShowPlanner(true)}><Icon name="target" size={19} /></button>
        <button className="icon-btn" title="学习统计" onClick={() => setShowStats(true)}><Icon name="chart" size={19} /></button>
        <button className="icon-btn" title="分析报告" onClick={() => setShowReport(true)}><Icon name="book" size={19} /></button>
        <button className="btn btn-ai" onClick={() => setShowAI(true)}><Icon name="flame" size={16} /> AI 排课</button>
        <button className="icon-btn" title="设置" onClick={() => setShowSettings(true)}><Icon name="gear" size={18} /></button>
        <button className="icon-btn" title="退出登录" onClick={handleLogout} style={{ color: "oklch(0.6 0.16 25)", opacity: 0.7 }}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>

      <div className="main">
        <Sidebar collapsed={collapsed} state={state} setState={setState} anchor={anchor}
          onManageCountdown={() => setShowCountdownMgr(true)}
          onReviewSubject={(id) => setReviewSubject(id)}
          toggleSubject={toggleSubject} />
        <div className="calwrap">
          <MottoBar motto={state.settings.motto} onChange={(motto) => setState((s) => ({ ...s, settings: { ...s.settings, motto } }))} />
          {view === "month" && <MonthView {...viewProps} />}
          {view === "week" && <WeekView {...viewProps} />}
          {view === "day" && <DayView {...viewProps} />}
        </div>
        {showAI && <AssistantPanel state={state} setState={setState} toast={toast} onClose={() => { setShowAI(false); window._reportContext = null; }} initialMsg={window._reportContext} />}
      </div>

      <div className="fab-stack">
        <div className="fab-ai-wrap">
          <span className="fab-ai-label">AI 排课</span>
          <button className="fab fab-ai" onClick={() => setShowAI(true)} title="AI 排课"><ClaudeLogo size={26} /></button>
        </div>
        <button className="fab" onClick={() => newEvent(anchor)} title="添加任务"><Icon name="plus" size={26} stroke={2.4} /></button>
      </div>

      {editing && (
        <EventDrawer event={editing} subjects={state.subjects}
          onSave={(ev, explicit) => {
            const title = (ev.title || "").trim();
            const hasTodos = (ev.todos || []).some((t) => (t.text || "").trim());
            // 点“保存”始终入库（explicit）；仅随手点空白处关闭时丢弃空白新任务
            if (!explicit && !title && !ev._exists && !hasTodos) return;
            const subj = state.subjects.find((s) => s.id === ev.subjectId);
            upsertEvent({ ...ev, title: title || (subj ? subj.name + " 学习" : "学习任务") });
          }}
          onDelete={deleteEvent} onClose={() => setEditing(null)} />
      )}
      {showStats && <StatsModal events={state.events} subjects={state.subjects} settings={state.settings} anchor={anchor} onClose={() => setShowStats(false)} />}
      {showPlanner && <WeeklyPlanner state={state} setState={setState} toast={toast} initialWeek={Da.weekKey(anchor)} onClose={() => setShowPlanner(false)} />}
      {showReport && <ReportModal state={state} setState={setState} anchor={anchor} toast={toast} onClose={() => setShowReport(false)} onOpenAI={(analysis) => { setShowReport(false); setShowAI(true); window._reportContext = analysis; }} />}
      {showCountdownMgr && <CountdownManager countdowns={state.countdowns}
        onChange={(countdowns) => setState((s) => ({ ...s, countdowns }))}
        onClose={() => setShowCountdownMgr(false)} />}
      {reviewSubject && <SubjectReviewModal subjectId={reviewSubject} state={state} setState={setState} onClose={() => setReviewSubject(null)} />}
      {showSettings && (
        <SettingsDrawer settings={state.settings}
          onSave={(set) => setState((s) => { const passHash = Da.getPasswordHash(); return { ...s, settings: { ...set, syncToken: s.settings.syncToken, syncGistId: s.settings.syncGistId, syncEnabled: s.settings.syncEnabled, passwordHash: passHash !== Da.DEFAULT_PASSHASH ? passHash : s.settings.passwordHash || "" } }; })}
          onReset={() => { Da.reset(); setState(Da.defaultState()); }}
          onExport={doExport}
          onExportBackup={doExportBackup}
          onImportBackup={doImportBackup}
          cloudEnabled={cloudEnabled}
          syncStatus={syncStatus}
          onConnectCloud={connectCloud}
          onDisconnectCloud={disconnectCloud}
          onSyncNow={syncNow}
          onClose={() => setShowSettings(false)} />
      )}
      {showSyncPrompt && (
        <SyncPrompt state={state} setState={setState} connectCloud={connectCloud} toast={toast} onClose={() => setShowSyncPrompt(false)} />
      )}
      {toastNode}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
