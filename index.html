<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="备考日历" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#fbf9f6" />
  <title>备考日历</title>
  <style>
/* ============ 备考日历 · 设计系统 ============ */
@import url("https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css");

:root {
  /* 字体 */
  --font-display: "LXGW WenKai", "STKaiti", "KaiTi", "PingFang SC", serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", system-ui, "Segoe UI", sans-serif;

  /* 浅色多巴胺 · 中性基底（暖白） */
  --bg: #fbf9f6;
  --bg-soft: #f4f1ec;
  --surface: #ffffff;
  --surface-2: #fcfbf9;
  --ink: #2c2a27;
  --ink-2: #6b6760;
  --ink-3: #a39e95;
  --line: #ece8e1;
  --line-2: #f3f0ea;

  /* 强调（主色：温暖的桃橘，多巴胺味）*/
  --accent: oklch(0.74 0.13 45);
  --accent-soft: oklch(0.94 0.05 45);
  --accent-ink: oklch(0.5 0.13 40);

  /* 阴影 */
  --shadow-sm: 0 1px 2px rgba(60, 50, 40, 0.04), 0 2px 6px rgba(60, 50, 40, 0.05);
  --shadow-md: 0 4px 14px rgba(60, 50, 40, 0.07), 0 10px 30px rgba(60, 50, 40, 0.06);
  --shadow-lg: 0 12px 40px rgba(60, 50, 40, 0.13), 0 4px 12px rgba(60, 50, 40, 0.07);

  /* 圆角 */
  --r-sm: 9px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-xl: 30px;
  --r-pill: 999px;

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
#root { height: 100vh; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }
::selection { background: var(--accent-soft); }

/* 滚动条 */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: #e3ded5; border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: #d3cdc2; background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }

.font-display { font-family: var(--font-display); }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- App 布局 ---------- */
.app { display: flex; flex-direction: column; height: 100vh; }

.topbar {
  display: flex; align-items: center; gap: 9px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0;
  background: conic-gradient(from 200deg, oklch(0.9 0.09 30), oklch(0.9 0.09 90), oklch(0.9 0.09 160), oklch(0.9 0.09 240), oklch(0.9 0.09 320), oklch(0.9 0.09 30));
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6), var(--shadow-sm);
}
.brand-mark::after { content: ""; width: 13px; height: 13px; border-radius: 5px; background: var(--surface); }
.brand-name { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; }
.brand-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; letter-spacing: 0.3px; }

.spacer { flex: 1; }

/* 分段控件 */
.segment { display: inline-flex; background: var(--bg-soft); border-radius: var(--r-pill); padding: 3px; gap: 2px; }
.segment button {
  padding: 7px 17px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 600;
  color: var(--ink-2); transition: all 0.22s var(--ease); position: relative;
}
.segment button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.segment button:not(.on):hover { color: var(--ink); }

.nav-group { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: var(--r-md); display: grid; place-items: center;
  color: var(--ink-2); transition: all 0.18s var(--ease); font-size: 17px;
}
.icon-btn:hover { background: var(--bg-soft); color: var(--ink); }
.period-label { font-family: var(--font-display); font-size: 18px; font-weight: 700; min-width: 124px; text-align: center; }

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 15px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 600;
  transition: all 0.18s var(--ease); white-space: nowrap;
}
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover { background: var(--bg-soft); color: var(--ink); }
.btn-soft { background: var(--bg-soft); color: var(--ink); }
.btn-soft:hover { background: #ece7df; }
.btn-accent { background: var(--ink); color: #fff; }
.btn-accent:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-today { background: var(--surface); border: 1px solid var(--line); color: var(--ink); box-shadow: var(--shadow-sm); }
.btn-today:hover { background: var(--bg-soft); }
.btn-ai { background: linear-gradient(135deg, oklch(0.78 0.13 35), oklch(0.74 0.13 350)); color: #fff; box-shadow: var(--shadow-sm); }
.btn-ai:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }

/* ---------- 主区 ---------- */
.main { flex: 1; display: flex; min-height: 0; }
.sidebar {
  width: 248px; flex-shrink: 0; border-right: 1px solid var(--line);
  background: var(--surface-2); overflow-y: auto; padding: 18px 16px 30px;
  transition: width 0.3s var(--ease), opacity 0.3s var(--ease);
}
.sidebar.collapsed { width: 0; padding: 0; opacity: 0; overflow: hidden; }
.calwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

/* 倒计时卡 */
.side-title { font-size: 11.5px; font-weight: 700; color: var(--ink-3); letter-spacing: 1px; text-transform: uppercase; margin: 22px 6px 10px; display: flex; align-items: center; justify-content: space-between; }

/* 科目条目 */
.subj-group-name { font-family: var(--font-display); font-size: 13px; color: var(--ink-2); margin: 14px 6px 6px; font-weight: 700; }
.subj-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: var(--r-md);
  cursor: pointer; transition: background 0.15s var(--ease); user-select: none;
}
.subj-item:hover { background: var(--bg-soft); }
.subj-item.off { opacity: 0.4; }
.subj-dot { width: 13px; height: 13px; border-radius: 5px; flex-shrink: 0; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,0.05); }
.subj-name { font-size: 13.5px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subj-min { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- 月视图 ---------- */
.month { flex: 1; display: flex; flex-direction: column; padding: 12px 18px 16px; overflow: hidden; }
.weekhead { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 8px; }
.weekhead div { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: 1px; padding: 2px 0; }
.weekhead .we { color: oklch(0.7 0.1 25); }
.monthgrid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 8px; min-height: 0; }
.daycell {
  background: var(--surface); border-radius: var(--r-md); padding: 8px; overflow: hidden;
  display: flex; flex-direction: column; gap: 4px; cursor: pointer; position: relative;
  border: 1.5px solid transparent; transition: all 0.16s var(--ease); min-height: 0;
}
.daycell:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.daycell.dim { background: var(--surface-2); }
.daycell.dim .dc-num { color: var(--ink-3); }
.daycell.today { border-color: var(--accent); }
.dc-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.dc-num { font-family: var(--font-display); font-size: 15px; font-weight: 700; line-height: 1; }
.dc-num.todaynum { background: var(--ink); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; }
.dc-min { font-size: 10.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 600; background: var(--bg-soft); padding: 1px 6px; border-radius: 99px; }
.dc-events { display: flex; flex-direction: column; gap: 3px; overflow: hidden; flex: 1; min-height: 0; }
.evpill {
  font-size: 11px; padding: 2.5px 7px; border-radius: 7px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; font-weight: 600; transition: all 0.14s var(--ease); flex-shrink: 0;
  display: flex; align-items: center; gap: 5px;
}
.evpill:hover { transform: scale(1.015); filter: brightness(0.98); }
.evpill.done { opacity: 0.55; }
.evpill.done .evpill-t { text-decoration: line-through; }
.evpill-t { overflow: hidden; text-overflow: ellipsis; }
.evpill-check { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; border: 1.5px solid currentColor; opacity: 0.55; }
.evpill.done .evpill-check { background: currentColor; }
.dc-more { font-size: 10.5px; color: var(--ink-3); padding-left: 4px; font-weight: 600; }
.dc-ring { position: absolute; right: 7px; bottom: 7px; }

/* ---------- 周/日 时间轴 ---------- */
.timeline-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0 0 0 0; }
.tl-head { display: grid; border-bottom: 1px solid var(--line); flex-shrink: 0; padding-right: 10px; }
.tl-head-cell { padding: 9px 6px 11px; text-align: center; border-left: 1px solid var(--line-2); }
.tl-head-cell:first-child { border-left: none; }
.tl-dow { font-size: 11.5px; color: var(--ink-3); font-weight: 700; letter-spacing: 1px; }
.tl-date { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin-top: 3px; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; }
.tl-date.today { background: var(--ink); color: #fff; }
.tl-head-cell .mini-ring { margin-top: 5px; }
.tl-corner { width: 56px; flex-shrink: 0; }
.tl-scroll { flex: 1; overflow-y: auto; position: relative; }
.tl-grid { display: grid; position: relative; }
.tl-hours { position: relative; }
.tl-hour-label { height: 56px; position: relative; }
.tl-hour-label span { position: absolute; top: -7px; right: 8px; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-col { position: relative; border-left: 1px solid var(--line-2); }
.tl-hour-line { height: 56px; border-top: 1px solid var(--line-2); box-sizing: border-box; }
.tl-hour-line.half { border-top: 1px dashed var(--line-2); }
.tl-event {
  position: absolute; left: 3px; right: 3px; border-radius: 9px; padding: 5px 8px; overflow: hidden;
  font-size: 11.5px; cursor: pointer; transition: all 0.14s var(--ease); box-shadow: var(--shadow-sm);
  border-left: 3px solid;
}
.tl-event:hover { transform: scale(1.01); box-shadow: var(--shadow-md); z-index: 5; }
.tl-event.done { opacity: 0.6; }
.tl-event .te-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-event .te-meta { font-size: 10.5px; opacity: 0.8; margin-top: 1px; font-variant-numeric: tabular-nums; }
.tl-now { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid oklch(0.65 0.2 25); z-index: 6; pointer-events: none; }
.tl-now::before { content: ""; position: absolute; left: -5px; top: -5px; width: 9px; height: 9px; border-radius: 50%; background: oklch(0.65 0.2 25); }

/* ---------- 进度环 ---------- */
.ring { position: relative; display: inline-grid; place-items: center; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring-label { position: absolute; text-align: center; line-height: 1; }

/* ---------- 模态 / 抽屉 ---------- */
.scrim { position: fixed; inset: 0; background: rgba(44,42,39,0.32); backdrop-filter: blur(3px); z-index: 100; opacity: 0; transition: opacity 0.25s var(--ease); }
.scrim.show { opacity: 1; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: 460px; max-width: 92vw;
  background: var(--surface); z-index: 101; box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform 0.32s var(--ease);
}
.drawer.show { transform: translateX(0); }
.drawer-head { padding: 20px 24px 14px; display: flex; align-items: flex-start; gap: 12px; border-bottom: 1px solid var(--line); }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 24px 30px; }
.drawer-foot { padding: 14px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }

.field { margin-bottom: 16px; }
.field-label { font-size: 11.5px; font-weight: 700; color: var(--ink-3); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 7px; display: block; }
.input {
  width: 100%; padding: 10px 13px; border-radius: var(--r-md); border: 1.5px solid var(--line);
  background: var(--surface-2); font-size: 14.5px; color: var(--ink); transition: all 0.16s var(--ease);
}
.input:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
.input.title-input { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
textarea.input { resize: vertical; min-height: 60px; line-height: 1.55; }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; }

/* 科目选择网格 */
.subj-pick { display: flex; flex-wrap: wrap; gap: 7px; }
.subj-chip {
  padding: 6px 12px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600;
  cursor: pointer; transition: all 0.16s var(--ease); border: 1.5px solid transparent;
}
.subj-chip:hover { transform: translateY(-1px); }
.subj-chip.on { box-shadow: var(--shadow-sm); }

/* 时长快捷 */
.dur-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.dur-quick button { padding: 5px 12px; border-radius: var(--r-pill); background: var(--bg-soft); font-size: 12.5px; font-weight: 600; color: var(--ink-2); transition: all 0.15s var(--ease); }
.dur-quick button:hover { background: #ece7df; color: var(--ink); }
.dur-quick button.on { background: var(--ink); color: #fff; }

/* to-do 列表 */
.todo-prog { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.todo-bar { flex: 1; height: 7px; background: var(--bg-soft); border-radius: 99px; overflow: hidden; }
.todo-bar i { display: block; height: 100%; border-radius: 99px; transition: width 0.4s var(--ease); }
.todo-list { display: flex; flex-direction: column; gap: 2px; }
.todo-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: var(--r-sm); transition: background 0.14s var(--ease); }
.todo-item:hover { background: var(--surface-2); }
.todo-item:hover .todo-del { opacity: 1; }
.todo-check {
  width: 20px; height: 20px; border-radius: 7px; border: 2px solid var(--line); flex-shrink: 0;
  display: grid; place-items: center; cursor: pointer; transition: all 0.16s var(--ease); color: #fff;
}
.todo-check.on { border-color: transparent; }
.todo-check svg { opacity: 0; transform: scale(0.5); transition: all 0.18s var(--ease-spring); }
.todo-check.on svg { opacity: 1; transform: scale(1); }
.todo-text { flex: 1; font-size: 14px; border: none; background: none; padding: 2px 0; color: var(--ink); }
.todo-text:focus { outline: none; }
.todo-text.done { text-decoration: line-through; color: var(--ink-3); }
.todo-del { opacity: 0; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-3); transition: all 0.14s var(--ease); flex-shrink: 0; }
.todo-del:hover { background: oklch(0.95 0.04 25); color: oklch(0.6 0.18 25); }
.todo-add { display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin-top: 2px; color: var(--ink-3); cursor: text; }
.todo-add .todo-check { border-style: dashed; }

/* 统计 modal */
.modal {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -46%) scale(0.97); opacity: 0;
  width: 880px; max-width: 94vw; max-height: 88vh; background: var(--surface); border-radius: var(--r-xl);
  z-index: 101; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden;
  transition: all 0.3s var(--ease);
}
.modal.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.modal-head { padding: 22px 28px 18px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.modal-title { font-family: var(--font-display); font-size: 23px; font-weight: 700; white-space: nowrap; }
.modal-body { overflow-y: auto; padding: 22px 28px 28px; }

/* 统计卡 */
.stat-overview { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; padding: 18px 22px; background: var(--surface-2); border-radius: var(--r-lg); margin-bottom: 22px; }
.stat-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.kpi-num { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1; }
.kpi-num small { font-size: 15px; color: var(--ink-2); margin-left: 3px; }
.kpi-label { font-size: 12px; color: var(--ink-2); margin-top: 5px; }
.subj-stat-row { display: grid; grid-template-columns: 160px 1fr auto; gap: 14px; align-items: center; padding: 11px 6px; border-bottom: 1px solid var(--line-2); }
.subj-stat-name { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; }
.subj-stat-bars { display: flex; flex-direction: column; gap: 5px; }
.sbar { height: 9px; border-radius: 99px; background: var(--bg-soft); overflow: hidden; }
.sbar i { display: block; height: 100%; border-radius: 99px; transition: width 0.5s var(--ease); }
.subj-stat-fig { text-align: right; font-variant-numeric: tabular-nums; }
.subj-stat-fig .big { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.subj-stat-fig .sm { font-size: 11.5px; color: var(--ink-3); }

.cycle-seg { display: inline-flex; background: var(--bg-soft); border-radius: var(--r-pill); padding: 3px; gap: 2px; }
.cycle-seg button { padding: 6px 14px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600; color: var(--ink-2); transition: all 0.2s var(--ease); }
.cycle-seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

/* 完成率追踪 */
.track-grid { display: grid; grid-template-columns: minmax(116px, 1.5fr) repeat(3, 1fr); }
.track-colhead { display: contents; }
.track-colhead > div { position: sticky; top: 0; background: var(--surface); z-index: 2; padding: 0 0 10px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); letter-spacing: 1px; text-align: center; }
.track-colhead > div:first-child { text-align: left; }
.track-group { display: contents; }
.track-group-name { grid-column: 1 / -1; display: flex; align-items: center; gap: 9px; margin: 16px 0 8px; }
.track-group-name b { font-family: var(--font-display); font-size: 15.5px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.track-group-name .gn-note { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; flex-shrink: 0; }
.track-group-name .gn-line { flex: 1; height: 1px; background: var(--line-2); }
.track-grp-cell { padding: 0 0 8px; }
.track-row { display: contents; }
.track-row > * { padding: 9px 4px; border-bottom: 1px solid var(--line-2); }
.track-name { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; }
.track-name .subj-dot { width: 11px; height: 11px; }
.track-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.track-cell .tc-frac { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.track-empty { display: grid; place-items: center; color: var(--ink-3); font-size: 12px; }
.track-empty small { font-size: 10px; opacity: 0.8; }
.track-grpring { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.track-grpring .tg-frac { font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.empty { text-align: center; color: var(--ink-3); padding: 40px 20px; font-size: 14px; }

/* 浮动添加按钮 */
.fab {
  position: fixed; right: 26px; bottom: 26px; width: 56px; height: 56px; border-radius: 50%;
  background: var(--ink); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow-lg);

/* 进入动画 */

.pill-toast {

/* 倒计时卡（多个 + 滚轮切换） */
.countdown {

.cd-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.cd-dots i.on { background: var(--accent-ink); width: 14px; border-radius: 99px; }
.cd-edit-card { background: var(--surface-2); border-radius: var(--r-md); padding: 12px; border: 1px solid var(--line); }
.cd-emoji-sel { font-size: 18px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--surface); padding: 5px 4px; cursor: pointer; }

/* 座右铭横幅 */
.motto-bar {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 13px 24px 12px; flex-shrink: 0;

.motto-text {

}

.motto-input {

}

/* 每日备忘录 */
.memo-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 11px 12px 8px; margin-bottom: 8px; }
.memo-head { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; color: var(--ink-2); letter-spacing: 0.5px; margin-bottom: 8px; }
.memo-head > span:first-of-type { flex: 1; }
.memo-count { color: var(--ink-3); font-weight: 600; }
.memo-clear { font-size: 11px; color: var(--ink-3); padding: 2px 7px; border-radius: 99px; }
.memo-clear:hover { background: var(--bg-soft); color: var(--ink); }
.memo-list { display: flex; flex-direction: column; gap: 1px; }
.memo-item { display: flex; align-items: center; gap: 8px; padding: 4px 3px; border-radius: 7px; transition: background 0.13s; }

.memo-item:hover .memo-del { opacity: 1; }
.memo-check { width: 17px; height: 17px; border-radius: 6px; border: 2px solid var(--line); flex-shrink: 0; display: grid; place-items: center; cursor: pointer; color: #fff; transition: all 0.15s var(--ease); }

.memo-add input:focus { outline: none; }
.memo-del { opacity: 0; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-3); flex-shrink: 0; transition: all 0.13s; }
.memo-del:hover { background: oklch(0.95 0.04 25); color: oklch(0.6 0.18 25); }

/* 科目条目加箭头 */
.subj-item .icon-arrow, .subj-item svg { color: var(--ink-3); opacity: 0; transition: opacity 0.15s var(--ease); flex-shrink: 0; }
.subj-item:hover svg { opacity: 0.6; }
.subj-item .subj-dot { cursor: pointer; }

/* 科目目标回顾 */
.rv-overview { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; padding: 18px 22px; border-radius: var(--r-lg); margin-bottom: 12px; }

.rv-month-head { display: flex; align-items: center; gap: 11px; padding: 11px 14px; cursor: pointer; transition: background 0.15s; }

.rv-month-head > svg { color: var(--ink-3); flex-shrink: 0; }
.rv-month-name { font-size: 16px; font-weight: 700; width: 44px; flex-shrink: 0; }
.rv-month-bar { flex: 1; height: 8px; background: var(--bg-soft); border-radius: 99px; overflow: hidden; }

.rv-month-pct { font-size: 14px; font-weight: 700; width: 42px; text-align: right; }
.rv-month-fig { font-size: 11.5px; color: var(--ink-3); width: 88px; text-align: right; }
.rv-weeks { padding: 4px 14px 14px; border-top: 1px solid var(--line-2); }

.rv-week-label { font-size: 12.5px; color: var(--ink); width: 118px; flex-shrink: 0; }
.rv-week-label small { color: var(--ink-3); font-size: 11px; }
.rv-week-bar { flex: 1; height: 7px; background: var(--bg-soft); border-radius: 99px; overflow: hidden; }

.menu hr { border: none; border-top: 1px solid var(--line-2); margin: 5px 0; }

/* ---------- AI 排课助手 ---------- */
.ai-panel {
  position: fixed; right: 22px; bottom: 22px; width: 392px; max-width: calc(100vw - 32px);
  height: 580px; max-height: calc(100vh - 44px); background: var(--surface); z-index: 110;

.ai-mark { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(140deg, oklch(0.78 0.13 35), oklch(0.74 0.13 350)); box-shadow: var(--shadow-sm); }
.ai-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.ai-bubble { max-width: 85%; padding: 10px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.55; }
.ai-bubble.ai { background: var(--bg-soft); border-bottom-left-radius: 5px; color: var(--ink); }
.ai-bubble.user { background: var(--ink); color: #fff; border-bottom-right-radius: 5px; }
.ai-changes { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; }
.ai-change { display: flex; align-items: flex-start; gap: 7px; font-size: 12.5px; background: var(--surface); border-radius: 9px; padding: 6px 9px; line-height: 1.4; }
.ai-change .acd { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.ai-change.create .acd { background: oklch(0.72 0.16 150); }
.ai-change.update .acd { background: var(--accent); }
.ai-change.delete .acd { background: oklch(0.7 0.16 28); }
.ai-undo { margin-top: 8px; font-size: 12.5px; font-weight: 600; color: var(--accent-ink); padding: 5px 11px; border-radius: 99px; background: var(--surface); transition: background 0.15s; }
.ai-undo:hover { background: var(--accent-soft); }
.ai-typing { display: flex; gap: 4px; padding: 12px 14px !important; }
.ai-typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite both; }
.ai-typing i:nth-child(2) { animation-delay: 0.2s; }
.ai-typing i:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
.ai-quick { padding: 0 16px 10px; display: flex; flex-direction: column; gap: 6px; }
.ai-quick button { text-align: left; font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 8px 11px; transition: all 0.15s var(--ease); }
.ai-quick button:hover { background: var(--bg-soft); color: var(--ink); transform: translateX(2px); }
.ai-input { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
.ai-input input { flex: 1; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: var(--r-pill); padding: 9px 15px; font-size: 14px; color: var(--ink); }
.ai-input input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.ai-mic, .ai-send { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; transition: all 0.16s var(--ease); }
.ai-mic { background: var(--bg-soft); color: var(--ink-2); }
.ai-mic:hover { background: #ece7df; }
.ai-mic.on { background: oklch(0.7 0.17 28); color: #fff; animation: micpulse 1.2s infinite; }

/* ---------- 每周规划 ---------- */
.goal-card { background: var(--surface-2); border-radius: var(--r-lg); padding: 16px 18px; }

.wd-pick button { width: 34px; height: 34px; border-radius: 10px; background: var(--surface); border: 1.5px solid var(--line); font-size: 13px; font-weight: 600; color: var(--ink-2); transition: all 0.15s var(--ease); }

/* ---------- 报告 ---------- */
.report-sheet { background: var(--surface); }

.rep-range { font-size: 13px; color: var(--ink-3); }
.rep-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }

.rep-kpis b { display: block; font-size: 23px; font-weight: 700; line-height: 1; }

.rep-subj-fig { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
.rep-subj-comment { font-size: 12.5px; color: var(--ink-2); margin: 2px 0 0; line-height: 1.5; }

/* 子项编辑 */
.subitem-wrap { margin-top: 11px; padding-top: 11px; border-top: 1px dashed var(--line); }
.subitem-head { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: var(--ink-3); letter-spacing: 0.5px; margin-bottom: 6px; padding: 0 2px; }

.subitem-add { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--accent-ink); padding: 5px 11px; border-radius: 99px; background: var(--accent-soft); transition: all 0.15s var(--ease); }
.subitem-add:hover { filter: brightness(0.97); }

/* 报告里的子项 */
.rep-subitems { margin: 7px 0 0 16px; padding-left: 12px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.rep-subitem { display: flex; align-items: center; gap: 9px; font-size: 12.5px; flex-wrap: wrap; }
.rep-si-name { font-weight: 600; color: var(--ink); width: 96px; flex-shrink: 0; }
.rep-si-bar { flex: 0 0 120px; height: 6px; background: var(--bg-soft); border-radius: 99px; overflow: hidden; }
.rep-si-bar i { display: block; height: 100%; border-radius: 99px; }
.rep-si-fig { color: var(--ink-3); font-size: 11.5px; width: 54px; text-align: right; }
.rep-si-pct { font-weight: 700; width: 38px; text-align: right; }
.rep-si-comment { color: var(--ink-2); font-size: 12px; flex: 1; min-width: 120px; }
.rep-foot { text-align: center; font-size: 11px; color: var(--ink-3); padding-top: 14px; border-top: 1px solid var(--line); margin-top: 6px; }

@media print {
  body.printing-report { overflow: visible; }
  body.printing-report .app, body.printing-report .scrim, body.printing-report .no-print,
  body.printing-report .fab, body.printing-report .ai-panel { display: none !important; }

  body.printing-report .modal-body { overflow: visible; padding: 0; }
  body.printing-report .report-sheet { padding: 0; }
  @page { margin: 16mm; }
}

@media (max-width: 760px) {
  .sidebar { position: fixed; z-index: 50; height: 100vh; box-shadow: var(--shadow-lg); }
  .period-label { min-width: auto; }
  .brand-sub { display: none; }
}

  <script>
/* ============ 备考日历 · 数据层 (plain JS) ============ */
(function () {
  const KEY = "beikao-cal-v2";

  // ---------- 颜色：浅色多巴胺，按色相均匀分布 ----------
  function subjColors(hue) {
    return {
      hue,
      fill: `oklch(0.93 0.072 ${hue})`,
      fillStrong: `oklch(0.88 0.10 ${hue})`,
      ink: `oklch(0.46 0.13 ${hue})`,

    };
  }

  // 预置科目（法考 / 法学课程 / 保研），色相手工挑选保证相邻区分
  const SUBJECT_DEFS = [
    // 法考
    ["刑法", "法考", 25],
    ["民法", "法考", 50],
    ["商法", "法考", 78],
    ["经济法", "法考", 135],
    ["知识产权法", "法考", 165],
    ["三国法", "法考", 195],
    ["民诉", "法考", 225],
    ["刑诉", "法考", 258],
    ["行政法", "法考", 290],
    ["理论法", "法考", 330],
    // 法学课程
    ["区域刑法学", "法学课程", 12],
    ["侵权法学", "法学课程", 105],
    ["破产法学", "法学课程", 210],
    ["刑事监察法学", "法学课程", 305],
    // 保研
    ["经济法保研", "保研", 60],
  ];

  function defaultSubjects() {
    return SUBJECT_DEFS.map(([name, group, hue], i) => ({
      id: "s" + i,
      name,
      group,
      ...subjColors(hue),
    }));
  }

  const GROUP_ORDER = ["法考", "法学课程", "保研"];

  // ---------- 日期工具 (周一为起) ----------
  function pad(n) { return String(n).padStart(2, "0"); }
  function iso(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function parseISO(s) { const [y, m, dd] = s.split("-").map(Number); return new Date(y, m - 1, dd); }
  function today() { return iso(new Date()); }
  function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function dow(s) { return (parseISO(s).getDay() + 6) % 7; } // 0=Mon..6=Sun
  function startOfWeek(s) { return addDays(s, -dow(s)); }
  function startOfMonth(s) { const d = parseISO(s); return iso(new Date(d.getFullYear(), d.getMonth(), 1)); }
  function endOfMonth(s) { const d = parseISO(s); return iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
  function sameMonth(a, b) { return a.slice(0, 7) === b.slice(0, 7); }

  const DOW_CN = ["一", "二", "三", "四", "五", "六", "日"];
  const MONTH_CN = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];

  function monthGrid(anchor) {
    // 返回 6*7=42 天，从锚点所在月首所在周一开始
    const first = startOfMonth(anchor);
    const gridStart = startOfWeek(first);
    const cells = [];
    for (let i = 0; i < 42; i++) cells.push(addDays(gridStart, i));
    return cells;
  }
  function weekDays(anchor) {
    const s = startOfWeek(anchor);
    return Array.from({ length: 7 }, (_, i) => addDays(s, i));
  }

  function fmtMin(min) {
    if (!min) return "0m";
    const h = Math.floor(min / 60), m = min % 60;
    if (h && m) return `${h}h${m}`;
    if (h) return `${h}h`;
    return `${m}m`;
  }
  function fmtHrs(min) { return (min / 60).toFixed(1); }

  function minToTime(min) { return `${pad(Math.floor(min / 60))}:${pad(min % 60)}`; }
  function timeToMin(t) { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; }

  // ---------- 默认种子数据（相对今天，确保始终“当下”） ----------
  function seed(subjects) {
    const find = (n) => subjects.find((s) => s.name === n).id;
    const t = today();
    const ev = [];
    let idc = 1;
    const mk = (dayOffset, subjName, title, start, dur, todos, done) => {
      ev.push({
        id: "e" + (idc++),
        date: addDays(t, dayOffset),
        subjectId: find(subjName),
        title,
        start,
        durationMin: dur,
        done: !!done,
        notes: "",
        todos: (todos || []).map((tt, i) => ({
          id: "t" + idc + "_" + i,
          text: typeof tt === "string" ? tt : tt[0],
          done: typeof tt === "string" ? false : !!tt[1],
        })),
      });
    };
    mk(0, "刑法", "刑法总论 · 犯罪构成", "08:30", 90,
      [["看课：犯罪客观要件", true], ["背诵：因果关系学说", true], "做题：真题30道", "整理错题本"], false);
    mk(0, "民法", "合同编 · 违约责任", "10:30", 75,
      [["精读法条 577-584", true], "案例分析2例", "对比预期违约/实际违约"], false);
    mk(0, "理论法", "宪法 · 国家机构", "14:00", 60,
      [["框架背诵", true], ["默写", true]], true);
    mk(0, "经济法保研", "竞争法专题论文研读", "16:00", 90,
      ["读《反垄断法》修订评述", "做读书笔记", "整理面试问答"], false);
    mk(1, "民诉", "管辖 + 证据", "09:00", 90,
      ["体系图记忆", "真题一套", "对答案订正"], false);
    mk(1, "知识产权法", "专利授权条件", "11:00", 60, ["三性判断标准", "典型案例"], false);
    mk(1, "区域刑法学", "讲座笔记整理", "15:00", 45, ["整理课堂录音", "提炼论点"], false);
    mk(2, "刑诉", "强制措施体系", "08:30", 75, ["对比五种措施", "真题20道"], false);
    mk(2, "行政法", "行政处罚法", "10:30", 60, ["新法变化梳理", "记忆口诀"], false);
    mk(2, "商法", "公司资本制度", "14:00", 60, ["认缴/实缴", "做题"], false);
    mk(3, "三国法", "国际私法 · 冲突规范", "09:00", 75, ["连结点记忆", "案例"], false);
    mk(3, "侵权法学", "产品责任案例研讨", "11:00", 60, ["案例阅读", "观点整理"], false);
    mk(4, "经济法", "税法专题", "09:00", 90, ["增值税计算", "真题"], false);
    mk(4, "破产法学", "重整程序", "14:00", 60, ["流程图", "笔记"], false);
    mk(-1, "刑法", "刑法分论 · 财产犯罪", "09:00", 90,
      [["盗窃/抢劫区分", true], ["真题", true], ["错题整理", true]], true);
    mk(-1, "民法", "物权编复习", "14:00", 60, [["善意取得", true], ["做题", true]], true);
    return ev;
  }

  // ---------- 持久化 ----------
  function defaultState() {
    const subjects = defaultSubjects();
    // 默认考试日：从今天起 90 天（用户可改）
    return {
      version: 3,
      subjects,
      events: seed(subjects),
      settings: {
        dailyGoalMin: 360,
        hiddenSubjects: [],
        motto: "千里之行，始于足下。今天也要踏实地走一步。",
        apiKey: "",
        activeCountdown: 0,
      },
      countdowns: [
        { id: "c1", name: "法考客观题", date: addDays(today(), 90), emoji: "⚖️" },
        { id: "c2", name: "期末考试", date: addDays(today(), 45), emoji: "📚" },
      ],
      memos: [], // [{id, text, done, date(创建日)}]
      weeklyPlans: {}, // weekKey -> [{subjectId, goalHours, dailyTodos:[], weekdays, startTime}]
      monthlyGoals: {}, // monthKey -> [{id, subjectId, name, totalHours, subItems:[{id,name,hours,done}]}]
      weeklyGoals: {}, // weekKey -> 同上结构（周报用）
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaultState();
      const s = JSON.parse(raw);
      if (!s || !s.subjects || !s.events) return defaultState();
      const def = defaultState();
      s.settings = Object.assign({}, def.settings, s.settings || {});
      s.weeklyPlans = s.weeklyPlans || {};
      s.monthlyGoals = s.monthlyGoals || {};
      s.weeklyGoals = s.weeklyGoals || {};
      s.memos = s.memos || [];
      // 迁移：旧的 examName/examDate -> countdowns
      if (!s.countdowns) {
        s.countdowns = [];
        if (s.settings.examName || s.settings.examDate) {
          s.countdowns.push({ id: uid("c"), name: s.settings.examName || "考试", date: s.settings.examDate || addDays(today(), 90), emoji: "⚖️" });
        }
        if (!s.countdowns.length) s.countdowns = def.countdowns;
      }
      if (s.settings.activeCountdown == null) s.settings.activeCountdown = 0;
      if (s.settings.motto == null) s.settings.motto = def.settings.motto;
      return s;
    } catch (e) {
      console.warn("load fail", e);
      return defaultState();
    }
  }
  function save(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { console.warn("save fail", e); }
  }
  function reset() { localStorage.removeItem(KEY); }

  // ---------- 统计聚合 ----------
  function eventCompletion(ev) {
    // 返回 {ratio, done, total} 基于 to-do；无 to-do 则按 done 标记
    if (ev.todos && ev.todos.length) {
      const d = ev.todos.filter((t) => t.done).length;
      return { ratio: d / ev.todos.length, done: d, total: ev.todos.length };
    }
    return { ratio: ev.done ? 1 : 0, done: ev.done ? 1 : 0, total: ev.done ? 1 : 0 };
  }
  function isEventDone(ev) {
    if (ev.todos && ev.todos.length) return ev.todos.every((t) => t.done);
    return !!ev.done;
  }

  function dayStats(events, date, goalMin) {
    const list = events.filter((e) => e.date === date);
    const planned = list.reduce((a, e) => a + (e.durationMin || 0), 0);
    const doneMin = list.reduce((a, e) => a + (isEventDone(e) ? e.durationMin || 0 : 0), 0);
    return { planned, doneMin, count: list.length, goal: goalMin, ratio: goalMin ? Math.min(1, doneMin / goalMin) : 0 };
  }

  function rangeStats(events, subjects, from, to) {
    // 返回每个科目 {plannedMin, doneMin, todoTotal, todoDone, count}
    const map = {};
    subjects.forEach((s) => (map[s.id] = { plannedMin: 0, doneMin: 0, todoTotal: 0, todoDone: 0, count: 0 }));
    let totPlanned = 0, totDone = 0, totTodo = 0, totTodoDone = 0;
    events.forEach((e) => {
      if (e.date < from || e.date > to) return;
      const m = map[e.subjectId];
      if (!m) return;
      m.count++;
      m.plannedMin += e.durationMin || 0;
      totPlanned += e.durationMin || 0;
      if (isEventDone(e)) { m.doneMin += e.durationMin || 0; totDone += e.durationMin || 0; }
      const c = eventCompletion(e);
      m.todoTotal += c.total; m.todoDone += c.done;
      totTodo += c.total; totTodoDone += c.done;
    });
    return { map, totPlanned, totDone, totTodo, totTodoDone };
  }

  // ---------- ICS 导出 ----------
  function icsEscape(s) { return (s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
  function dtStamp() {
    const d = new Date();
    return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
  }
  function buildICS(state) {
    const lines = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//备考日历//CN", "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH", "X-WR-CALNAME:备考日历", "X-WR-TIMEZONE:Asia/Shanghai",
    ];
    const subjById = {};
    state.subjects.forEach((s) => (subjById[s.id] = s));
    state.events.forEach((e) => {
      const s = subjById[e.subjectId];
      const d = e.date.replace(/-/g, "");
      const summary = icsEscape(`${s ? "【" + s.name + "】" : ""}${e.title}`);
      let dt;
      if (e.start) {
        const sm = timeToMin(e.start);
        const em = sm + (e.durationMin || 60);
        dt = [`DTSTART;TZID=Asia/Shanghai:${d}T${pad(Math.floor(sm / 60))}${pad(sm % 60)}00`,
        `DTEND;TZID=Asia/Shanghai:${d}T${pad(Math.floor(em / 60) % 24)}${pad(em % 60)}00`];
      } else {
        dt = [`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${d}`];
      }
      const todoTxt = (e.todos || []).map((t) => `${t.done ? "✓" : "○"} ${t.text}`).join("\\n");
      const desc = icsEscape(`计划时长 ${fmtMin(e.durationMin)}` + (todoTxt ? "\n清单:\n" : "")) + todoTxt + (e.notes ? "\\n\\n" + icsEscape(e.notes) : "");
      lines.push("BEGIN:VEVENT", `UID:${e.id}@beikao-cal`, `DTSTAMP:${dtStamp()}`, ...dt,
        `SUMMARY:${summary}`, `DESCRIPTION:${desc}`,
        `CATEGORIES:${icsEscape(s ? s.group : "")}`, "END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    return lines.join("\r\n");
  }
  function downloadICS(state) {
    const blob = new Blob([buildICS(state)], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "备考日历.ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function uid(p) { return (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // ---------- 周/月 key ----------
  function weekKey(date) { return startOfWeek(date); }              // 周一 ISO
  function monthKey(date) { return date.slice(0, 7); }              // YYYY-MM

  function resolveSubject(subjects, name) {
    if (!name) return null;
    const n = String(name).trim();
    let s = subjects.find((x) => x.name === n);
    if (s) return s;
    s = subjects.find((x) => n.includes(x.name) || x.name.includes(n));
    return s || null;
  }

  // ---------- AI 指令 → 动作应用 ----------
  // actions: [{op:'create'|'update'|'delete', ...}]; 返回 {events, summary[]}
  function applyActions(state, actions) {
    let events = state.events.slice();
    const summary = [];
    const subjById = {};
    state.subjects.forEach((s) => (subjById[s.id] = s));
    const firstVisible = state.subjects.find((s) => !(state.settings.hiddenSubjects || []).includes(s.id)) || state.subjects[0];
    const toTodos = (arr) => (arr || []).map((t) => ({
      id: uid("t"), text: typeof t === "string" ? t : (t.text || ""), done: typeof t === "object" ? !!t.done : false,
    }));

    (actions || []).forEach((a) => {
      if (!a || !a.op) return;
      if (a.op === "create") {
        const subj = resolveSubject(state.subjects, a.subject) || firstVisible;
        const ev = {
          id: uid("e"), date: a.date || today(), subjectId: subj.id,
          title: a.title || "学习任务", start: a.start || null,
          durationMin: Math.max(10, +a.durationMin || 60), done: !!a.done, notes: a.notes || "",
          todos: toTodos(a.todos),
        };
        events.push(ev);
        summary.push({ op: "create", text: `新增「${subj.name} · ${ev.title}」 ${a.date || ""} ${ev.start || ""} ${fmtMin(ev.durationMin)}` });
      } else if (a.op === "update") {
        const idx = events.findIndex((e) => e.id === a.id);
        if (idx < 0) return;
        const prev = events[idx];
        const next = { ...prev };
        if (a.date) next.date = a.date;
        if (a.title != null) next.title = a.title;
        if (a.start !== undefined) next.start = a.start || null;
        if (a.durationMin != null) next.durationMin = Math.max(10, +a.durationMin);
        if (a.done != null) next.done = !!a.done;
        if (a.notes != null) next.notes = a.notes;
        if (a.subject) { const s = resolveSubject(state.subjects, a.subject); if (s) next.subjectId = s.id; }
        if (a.todos) next.todos = toTodos(a.todos);
        events[idx] = next;
        summary.push({ op: "update", text: `修改「${(subjById[next.subjectId] || {}).name || ""} · ${next.title}」` });
      } else if (a.op === "delete") {
        const ev = events.find((e) => e.id === a.id);
        if (ev) {
          events = events.filter((e) => e.id !== a.id);
          summary.push({ op: "delete", text: `删除「${(subjById[ev.subjectId] || {}).name || ""} · ${ev.title}」` });
        }
      }
    });
    return { events, summary };
  }

  // 紧凑事件清单（喂给 AI，含 id 以便改/删）
  function compactEvents(state, from, to) {
    const subjById = {};
    state.subjects.forEach((s) => (subjById[s.id] = s));
    return state.events
      .filter((e) => (!from || e.date >= from) && (!to || e.date <= to))
      .sort((a, b) => (a.date + (a.start || "")).localeCompare(b.date + (b.start || "")))
      .map((e) => {
        const c = eventCompletion(e);
        return `${e.id}|${e.date}|${(subjById[e.subjectId] || {}).name || "?"}|${e.start || "--"}|${e.durationMin}m|${e.title}|todo ${c.done}/${c.total}`;
      });
  }

  // ---------- 周规划进度：goal vs 计划 vs 完成 ----------
  function planProgress(state, weekStart) {
    const plan = (state.weeklyPlans || {})[weekStart] || [];
    const from = weekStart, to = addDays(weekStart, 6);
    const { map } = rangeStats(state.events, state.subjects, from, to);
    return plan.map((p) => {
      const m = map[p.subjectId] || { plannedMin: 0, doneMin: 0, todoTotal: 0, todoDone: 0, count: 0 };
      return {
        ...p,
        goalMin: Math.round((p.goalHours || 0) * 60),
        plannedMin: m.plannedMin, doneMin: m.doneMin,
        todoTotal: m.todoTotal, todoDone: m.todoDone, count: m.count,
      };
    });
  }

  // ---------- 可移植 AI 调用 ----------
  // 优先用 Claude 环境注入的 window.claude；否则用用户自己的 API key 直连 Anthropic。
  async function aiComplete(prompt, apiKey) {
    if (typeof window !== "undefined" && window.claude && window.claude.complete) {
      return await window.claude.complete(prompt);
    }
    const key = apiKey || (window.CalData && window.CalData._apiKey) || "";
    if (!key) { const e = new Error("NO_AI"); e.code = "NO_AI"; throw e; }
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-3-5-sonnet-20241022",
        max_tokens: 2000,
        messages: [{ role: "user", content: prompt }],
      }),
    });
    if (!resp.ok) { const t = await resp.text(); const e = new Error("API " + resp.status + ": " + t.slice(0, 200)); e.code = "API_ERR"; throw e; }
    const data = await resp.json();
    return (data.content && data.content[0] && data.content[0].text) || "";
  }
  function aiAvailable(state) {
    return !!(typeof window !== "undefined" && ((window.claude && window.claude.complete) || (state && state.settings && state.settings.apiKey)));
  }

  // ---------- 每月所含的周（周一起点） ----------
  function weeksInMonth(monthKeyStr) {
    const [y, m] = monthKeyStr.split("-").map(Number);
    const first = iso(new Date(y, m - 1, 1));
    const last = endOfMonth(first);
    let w = startOfWeek(first);
    const out = [];
    while (w <= last) { out.push(w); w = addDays(w, 7); }
    return out; // 每个是周一 ISO
  }

  // ---------- 科目目标回顾（F3）：按月→周聚合 ----------
  // 完成率口径 = 该范围内该科目 to-do 完成 / 总数
  function subjectReview(state, subjectId, monthsBack) {
    const out = [];
    const base = parseISO(startOfMonth(today()));
    const n = monthsBack || 4;
    for (let i = 0; i < n; i++) {
      const d = new Date(base.getFullYear(), base.getMonth() - i, 1);
      const mk = iso(d).slice(0, 7);
      const mFrom = startOfMonth(iso(d)), mTo = endOfMonth(iso(d));
      const ms = rangeStats(state.events, state.subjects, mFrom, mTo).map[subjectId] || { plannedMin: 0, doneMin: 0, todoTotal: 0, todoDone: 0, count: 0 };
      // 月度目标（来自 monthlyGoals 或 周计划合计）
      const mg = ((state.monthlyGoals || {})[mk] || []).find((g) => g.subjectId === subjectId);
      let goalH = mg ? mg.totalHours : 0;
      const weeks = weeksInMonth(mk).map((wStart) => {
        const wTo = addDays(wStart, 6);
        const ws = rangeStats(state.events, state.subjects, wStart, wTo).map[subjectId] || { plannedMin: 0, doneMin: 0, todoTotal: 0, todoDone: 0, count: 0 };
        const wp = ((state.weeklyPlans || {})[wStart] || []).find((p) => p.subjectId === subjectId);
        if (!goalH && wp) goalH = (goalH || 0); // 占位
        return {
          weekStart: wStart, to: wTo,
          goalH: wp ? wp.goalHours : 0,
          todoTotal: ws.todoTotal, todoDone: ws.todoDone,
          ratio: ws.todoTotal ? ws.todoDone / ws.todoTotal : 0,
          doneMin: ws.doneMin, plannedMin: ws.plannedMin, count: ws.count,
        };
      });
      if (!goalH) goalH = weeks.reduce((a, w) => a + (w.goalH || 0), 0);
      out.push({
        monthKey: mk,
        goalH,
        todoTotal: ms.todoTotal, todoDone: ms.todoDone,
        ratio: ms.todoTotal ? ms.todoDone / ms.todoTotal : 0,
        doneMin: ms.doneMin, plannedMin: ms.plannedMin, count: ms.count,
        weeks,
      });
    }
    return out;
  }

  window.CalData = {
    KEY, defaultState, load, save, reset, defaultSubjects, GROUP_ORDER, subjColors,
    iso, parseISO, today, addDays, dow, startOfWeek, startOfMonth, endOfMonth, daysBetween,
    sameMonth, monthGrid, weekDays, DOW_CN, MONTH_CN, fmtMin, fmtHrs, minToTime, timeToMin, pad,
    eventCompletion, isEventDone, dayStats, rangeStats, buildICS, downloadICS, uid,
    weekKey, monthKey, resolveSubject, applyActions, compactEvents, planProgress,
    aiComplete, aiAvailable, weeksInMonth, subjectReview,
  };
})();

    trash: <g><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6M14 11v6" /></g>,
    clock: <g><circle cx="12" cy="12" r="9" /><polyline points="12 7 12 12 15 14" /></g>,
    chart: <g><line x1="4" y1="20" x2="4" y2="10" /><line x1="10" y1="20" x2="10" y2="4" /><line x1="16" y1="20" x2="16" y2="14" /><line x1="22" y1="20" x2="2" y2="20" /></g>,
    download: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></g>,
    grip: <g><circle cx="9" cy="6" r="1" /><circle cx="9" cy="12" r="1" /><circle cx="9" cy="18" r="1" /><circle cx="15" cy="6" r="1" /><circle cx="15" cy="12" r="1" /><circle cx="15" cy="18" r="1" /></g>,
    cal: <g><rect x="3" y="4" width="18" height="18" rx="3" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="8" y1="2" x2="8" y2="5" /><line x1="16" y1="2" x2="16" y2="5" /></g>,
    menu: <g><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></g>,
    gear: <g><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></g>,

    target: <g><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5" /><circle cx="12" cy="12" r="1.4" fill="currentColor" /></g>,
    book: <g><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></g>,
  };
  return <svg {...p}>{paths[name] || null}</svg>;
}

/* ---------- 进度环 ---------- */
function Ring({ value = 0, size = 30, stroke = 4, color = "var(--accent)", track = "var(--bg-soft)", children, glow }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const v = Math.max(0, Math.min(1, value));
  return (
    <div className="ring" style={{ width: size, height: size }}>
      <svg width={size} height={size}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={track} strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeDasharray={c} strokeDashoffset={c * (1 - v)} strokeLinecap="round"
          style={{ transition: "stroke-dashoffset 0.6s var(--ease)", filter: glow ? `drop-shadow(0 0 4px ${color})` : "none" }} />
      </svg>
      {children != null && <div className="ring-label">{children}</div>}
    </div>
  );
}

function MiniRing({ value, size = 22 }) {
  return <Ring value={value} size={size} stroke={3} className="mini-ring" />;
}

/* ---------- to-do 编辑器 ---------- */
function TodoEditor({ todos, onChange, color }) {
  const [adding, setAdding] = useState("");
  const addRef = useRef(null);
  const done = todos.filter((t) => t.done).length;
  const ratio = todos.length ? done / todos.length : 0;

  const toggle = (id) => onChange(todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));
  const edit = (id, text) => onChange(todos.map((t) => (t.id === id ? { ...t, text } : t)));
  const del = (id) => onChange(todos.filter((t) => t.id !== id));
  const add = () => {
    const v = adding.trim();
    if (!v) return;
    onChange([...todos, { id: D.uid("t"), text: v, done: false }]);
    setAdding("");
    setTimeout(() => addRef.current && addRef.current.focus(), 10);
  };

  return (
    <div>
      <div className="todo-prog">
        <div className="todo-bar"><i style={{ width: `${ratio * 100}%`, background: color || "var(--accent)" }} /></div>
        <span className="tnum" style={{ fontSize: 12.5, color: "var(--ink-2)", fontWeight: 600 }}>{done}/{todos.length}</span>
      </div>
      <div className="todo-list">
        {todos.map((t) => (
          <div className="todo-item" key={t.id}>
            <div className={"todo-check" + (t.done ? " on" : "")} onClick={() => toggle(t.id)}
              style={{ background: t.done ? (color || "var(--accent)") : "transparent", borderColor: t.done ? "transparent" : undefined }}>
              <Icon name="check" size={13} stroke={3} />
            </div>
            <input className={"todo-text" + (t.done ? " done" : "")} value={t.text}
              onChange={(e) => edit(t.id, e.target.value)} placeholder="待办事项…" />
            <button className="todo-del" onClick={() => del(t.id)}><Icon name="trash" size={14} /></button>
          </div>
        ))}
        <div className="todo-add" onClick={() => addRef.current && addRef.current.focus()}>
          <div className="todo-check"><Icon name="plus" size={13} stroke={2.6} /></div>
          <input ref={addRef} className="todo-text" value={adding} placeholder="添加待办…"
            onChange={(e) => setAdding(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") add(); }}
            onBlur={add} />
        </div>
      </div>
    </div>
  );
}

/* ---------- 事件编辑抽屉 ---------- */
const DUR_PRESETS = [25, 45, 60, 90, 120];

function EventDrawer({ event, subjects, onSave, onDelete, onClose }) {
  const [show, setShow] = useState(false);
  const [draft, setDraft] = useState(event);
  useEffect(() => { setDraft(event); }, [event && event.id]);
  useEffect(() => { const t = setTimeout(() => setShow(true), 10); return () => clearTimeout(t); }, []);

  if (!draft) return null;
  const subj = subjects.find((s) => s.id === draft.subjectId) || subjects[0];

  const close = () => { setShow(false); setTimeout(onClose, 300); };
  const patch = (p) => setDraft((d) => ({ ...d, ...p }));
  const commit = (next) => { const v = next || draft; onSave(v); };

  // 自动保存（失焦/关闭时）
  const handleClose = () => { commit(); close(); };

  const groups = D.GROUP_ORDER.map((g) => [g, subjects.filter((s) => s.group === g)]);

  return (
    <React.Fragment>
      <div className={"scrim" + (show ? " show" : "")} onClick={handleClose} />
      <div className={"drawer" + (show ? " show" : "")}>
        <div className="drawer-head">
          <div className="subj-dot" style={{ background: subj.solid, width: 18, height: 18, marginTop: 6 }} />
          <input className="input title-input" style={{ border: "none", background: "none", padding: 0, boxShadow: "none" }}
            value={draft.title} placeholder="任务标题…" autoFocus
            onChange={(e) => patch({ title: e.target.value })} />
          <button className="icon-btn" onClick={handleClose}><Icon name="close" /></button>
        </div>
        <div className="drawer-body">
          {/* 科目 */}
          <div className="field">
            <label className="field-label">科目</label>
            <div className="subj-pick">
              {groups.map(([g, list]) => list.map((s) => (
                <div key={s.id} className={"subj-chip" + (s.id === draft.subjectId ? " on" : "")}
                  onClick={() => patch({ subjectId: s.id })}
                  style={{ background: s.id === draft.subjectId ? s.fillStrong : s.fill, color: s.ink, borderColor: s.id === draft.subjectId ? s.solid : "transparent" }}>
                  {s.name}
                </div>
              )))}
            </div>
          </div>
          {/* 日期 / 时间 */}
          <div className="row">
            <div className="field">
              <label className="field-label">日期</label>
              <input type="date" className="input tnum" value={draft.date} onChange={(e) => patch({ date: e.target.value })} />
            </div>
            <div className="field">
              <label className="field-label">开始时间</label>
              <input type="time" className="input tnum" value={draft.start || ""} onChange={(e) => patch({ start: e.target.value || null })} />
            </div>
          </div>
          {/* 时长 */}
          <div className="field">
            <label className="field-label">计划时长 · {D.fmtMin(draft.durationMin)}</label>
            <input type="range" min="15" max="240" step="5" value={draft.durationMin}
              style={{ width: "100%", accentColor: subj.solid }}
              onChange={(e) => patch({ durationMin: +e.target.value })} />
            <div className="dur-quick">
              {DUR_PRESETS.map((m) => (
                <button key={m} className={draft.durationMin === m ? "on" : ""} onClick={() => patch({ durationMin: m })}>{D.fmtMin(m)}</button>
              ))}
            </div>
          </div>
          {/* to-do */}
          <div className="field">
            <label className="field-label">待办清单 (To-do)</label>
            <TodoEditor todos={draft.todos} color={subj.solid} onChange={(todos) => patch({ todos })} />
          </div>
          {/* 备注 */}
          <div className="field">
            <label className="field-label">备注</label>
            <textarea className="input" value={draft.notes || ""} placeholder="补充说明…"
              onChange={(e) => patch({ notes: e.target.value })} />
          </div>
        </div>
        <div className="drawer-foot">
          {onDelete && draft._exists && (
            <button className="btn btn-ghost" style={{ color: "oklch(0.6 0.18 25)" }}
              onClick={() => { if (confirm("删除这个任务？")) { onDelete(draft.id); close(); } }}>
              <Icon name="trash" size={15} /> 删除
            </button>
          )}
          <div className="spacer" />
          <button className="btn btn-soft" onClick={handleClose}>取消</button>
          <button className="btn btn-accent" onClick={() => { commit(); close(); }}>
            <Icon name="check" size={15} stroke={2.6} /> 保存
          </button>
        </div>
      </div>
    </React.Fragment>
  );
}

Object.assign(window, { Icon, Ring, MiniRing, TodoEditor, EventDrawer, DUR_PRESETS });

</script>
  <script type="text/babel">
/* ============ 备考日历 · 视图 (月/周/日) ============ */
const Dv = window.CalData;

function subjOf(subjects, id) { return subjects.find((s) => s.id === id) || subjects[0]; }

/* ---------- 月视图 ---------- */
function MonthView({ anchor, events, subjects, settings, onDay, onEvent, onAdd }) {
  const cells = Dv.monthGrid(anchor);
  const t = Dv.today();
  const byDay = useMemo(() => {
    const m = {};
    events.forEach((e) => { (m[e.date] = m[e.date] || []).push(e); });
    Object.values(m).forEach((l) => l.sort((a, b) => (a.start || "99").localeCompare(b.start || "99")));
    return m;
  }, [events]);

  return (
    <div className="month">
      <div className="weekhead">
        {Dv.DOW_CN.map((d, i) => <div key={d} className={i >= 5 ? "we" : ""}>{d}</div>)}
      </div>
      <div className="monthgrid">
        {cells.map((date) => {
          const list = byDay[date] || [];
          const ds = Dv.dayStats(events, date, settings.dailyGoalMin);
          const dim = date.slice(0, 7) !== anchor.slice(0, 7);
          const isToday = date === t;
          const maxShow = 3;
          return (
            <div key={date} className={"daycell" + (dim ? " dim" : "") + (isToday ? " today" : "")}
              onClick={() => onDay(date)} onDoubleClick={() => onAdd(date)}>
              <div className="dc-top">
                <span className={"dc-num" + (isToday ? " todaynum" : "")}>{+date.slice(8)}</span>
                {ds.planned > 0 && <span className="dc-min tnum">{Dv.fmtMin(ds.planned)}</span>}
              </div>
              <div className="dc-events">
                {list.slice(0, maxShow).map((e) => {
                  const s = subjOf(subjects, e.subjectId);
                  const done = Dv.isEventDone(e);
                  return (
                    <div key={e.id} className={"evpill" + (done ? " done" : "")}
                      style={{ background: s.fill, color: s.ink }}
                      onClick={(ev) => { ev.stopPropagation(); onEvent(e); }}>
                      <span className="evpill-check" style={{ borderColor: s.solid, background: done ? s.solid : "transparent" }} />
                      <span className="evpill-t">{e.title}</span>
                    </div>
                  );
                })}
                {list.length > maxShow && <div className="dc-more">+{list.length - maxShow} 更多</div>}
              </div>
              {ds.planned > 0 && (
                <div className="dc-ring">
                  <Ring value={ds.ratio} size={20} stroke={3}
                    color={ds.ratio >= 1 ? "oklch(0.72 0.16 150)" : "var(--accent)"} />
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- 时间轴（周/日共用） ---------- */
const HOUR_H = 56;
const START_HOUR = 6;
const END_HOUR = 24;

function layoutDay(list) {
  // 为有时间的事件计算重叠列布局
  const timed = list.filter((e) => e.start).map((e) => {
    const s = Dv.timeToMin(e.start);
    return { e, s, end: s + (e.durationMin || 30) };
  }).sort((a, b) => a.s - b.s || a.end - b.end);
  // 分组重叠
  const cols = [];
  timed.forEach((it) => {
    let placed = false;
    for (const col of cols) {
      if (col[col.length - 1].end <= it.s) { col.push(it); it.col = cols.indexOf(col); placed = true; break; }
    }
    if (!placed) { it.col = cols.length; cols.push([it]); }
  });
  const ncol = Math.max(1, cols.length);
  timed.forEach((it) => (it.ncol = ncol));
  const untimed = list.filter((e) => !e.start);
  return { timed, untimed };
}

function NowLine({ date }) {
  const [, force] = useState(0);
  useEffect(() => { const i = setInterval(() => force((x) => x + 1), 60000); return () => clearInterval(i); }, []);
  if (date !== Dv.today()) return null;
  const now = new Date();
  const min = now.getHours() * 60 + now.getMinutes();
  if (min < START_HOUR * 60 || min > END_HOUR * 60) return null;
  const top = ((min - START_HOUR * 60) / 60) * HOUR_H;
  return <div className="tl-now" style={{ top }} />;
}

function TimelineEvent({ it, subjects, onEvent, single }) {
  const { e } = it;
  const s = subjOf(subjects, e.subjectId);
  const done = Dv.isEventDone(e);
  const top = ((it.s - START_HOUR * 60) / 60) * HOUR_H;
  const h = Math.max(22, ((e.durationMin || 30) / 60) * HOUR_H - 3);
  const w = 100 / it.ncol;
  const comp = Dv.eventCompletion(e);
  return (
    <div className={"tl-event" + (done ? " done" : "")}
      style={{
        top, height: h, left: `calc(${it.col * w}% + 3px)`, width: `calc(${w}% - 6px)`,
        background: s.fill, color: s.ink, borderLeftColor: s.solid,
      }}
      onClick={() => onEvent(e)}>
      <div className="te-title">{done ? "✓ " : ""}{e.title}</div>
      {h > 34 && <div className="te-meta tnum">{e.start} · {Dv.fmtMin(e.durationMin)}{comp.total ? ` · ${comp.done}/${comp.total}` : ""}</div>}
    </div>
  );
}

function Timeline({ days, events, subjects, settings, onEvent, onAdd, onDayHeader }) {
  const scrollRef = useRef(null);
  const t = Dv.today();
  const hours = [];
  for (let h = START_HOUR; h < END_HOUR; h++) hours.push(h);

  useEffect(() => {
    // 滚动到 7:30 左右
    if (scrollRef.current) scrollRef.current.scrollTop = 1.2 * HOUR_H;
  }, [days[0]]);

  const byDay = useMemo(() => {
    const m = {};
    days.forEach((d) => (m[d] = layoutDay(events.filter((e) => e.date === d))));
    return m;
  }, [events, days.join()]);

  const colTemplate = `56px repeat(${days.length}, 1fr)`;

  return (
    <div className="timeline-wrap">
      <div className="tl-head" style={{ gridTemplateColumns: colTemplate }}>
        <div className="tl-corner" />
        {days.map((d) => {
          const ds = Dv.dayStats(events, d, settings.dailyGoalMin);
          const isT = d === t;
          const di = Dv.dow(d);
          return (
            <div className="tl-head-cell" key={d} style={{ cursor: onDayHeader ? "pointer" : "default" }}
              onClick={() => onDayHeader && onDayHeader(d)}>
              <div className="tl-dow" style={di >= 5 ? { color: "oklch(0.7 0.1 25)" } : null}>周{Dv.DOW_CN[di]}</div>
              <div className={"tl-date" + (isT ? " today" : "")}>{+d.slice(8)}</div>
              <div style={{ display: "flex", justifyContent: "center", marginTop: 4 }}>
                <Ring value={ds.ratio} size={26} stroke={3.5}
                  color={ds.ratio >= 1 ? "oklch(0.72 0.16 150)" : "var(--accent)"}>
                  {ds.planned > 0 && <span className="tnum" style={{ fontSize: 8.5, color: "var(--ink-2)", fontWeight: 700 }}>{Math.round(ds.ratio * 100)}</span>}
                </Ring>
              </div>
            </div>
          );
        })}
      </div>
      <div className="tl-scroll" ref={scrollRef}>
        <div className="tl-grid" style={{ gridTemplateColumns: colTemplate, minHeight: hours.length * HOUR_H }}>
          <div className="tl-hours">
            {hours.map((h) => (
              <div className="tl-hour-label" key={h}><span className="tnum">{Dv.pad(h)}:00</span></div>
            ))}
          </div>
          {days.map((d) => {
            const { timed, untimed } = byDay[d];
            return (
              <div className="tl-col" key={d}>
                {hours.map((h) => (
                  <div className="tl-hour-line" key={h}
                    onClick={() => onAdd(d, Dv.minToTime(h * 60))} style={{ cursor: "copy" }} />
                ))}
                {timed.map((it) => <TimelineEvent key={it.e.id} it={it} subjects={subjects} onEvent={onEvent} />)}
                <NowLine date={d} />
                {untimed.length > 0 && (
                  <div style={{ position: "absolute", top: 2, left: 3, right: 3, display: "flex", flexDirection: "column", gap: 2 }}>
                    {untimed.map((e) => {
                      const s = subjOf(subjects, e.subjectId);
                      return <div key={e.id} className="evpill" style={{ background: s.fill, color: s.ink }} onClick={() => onEvent(e)}>
                        <span className="evpill-t">{e.title}</span></div>;
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function WeekView(props) {
  const days = Dv.weekDays(props.anchor);
  return <Timeline days={days} {...props} onDayHeader={props.onDay} />;
}

/* ---------- 日视图：时间轴 + 当日清单焦点 ---------- */
function DayView({ anchor, events, subjects, settings, onEvent, onAdd }) {
  const list = useMemo(() => events.filter((e) => e.date === anchor)
    .sort((a, b) => (a.start || "99").localeCompare(b.start || "99")), [events, anchor]);
  const ds = Dv.dayStats(events, anchor, settings.dailyGoalMin);
  const totalTodo = list.reduce((a, e) => a + (e.todos ? e.todos.length : 0), 0);
  const doneTodo = list.reduce((a, e) => a + (e.todos ? e.todos.filter((t) => t.done).length : 0), 0);

  return (
    <div style={{ flex: 1, display: "flex", minHeight: 0 }}>
      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
        <Timeline days={[anchor]} events={events} subjects={subjects} settings={settings} onEvent={onEvent} onAdd={onAdd} />
      </div>
      <div style={{ width: 300, flexShrink: 0, borderLeft: "1px solid var(--line)", padding: "20px 18px", overflowY: "auto", background: "var(--surface-2)" }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", paddingBottom: 18, borderBottom: "1px solid var(--line)" }}>
          <Ring value={ds.ratio} size={128} stroke={12} glow
            color={ds.ratio >= 1 ? "oklch(0.72 0.16 150)" : "var(--accent)"}>
            <div>
              <div className="font-display tnum" style={{ fontSize: 30, fontWeight: 700, lineHeight: 1 }}>{Math.round(ds.ratio * 100)}<small style={{ fontSize: 15 }}>%</small></div>
              <div style={{ fontSize: 11, color: "var(--ink-2)", marginTop: 3 }}>今日目标</div>
            </div>
          </Ring>
          <div className="tnum" style={{ marginTop: 14, fontSize: 13.5, color: "var(--ink-2)" }}>
            已完成 <b style={{ color: "var(--ink)" }}>{Dv.fmtMin(ds.doneMin)}</b> / 计划 {Dv.fmtMin(ds.planned)}
          </div>
          <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 4 }}>目标 {Dv.fmtMin(settings.dailyGoalMin)} · 待办 {doneTodo}/{totalTodo}</div>
        </div>
        <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--ink-3)", letterSpacing: 1, margin: "16px 2px 10px" }}>当日任务 ({list.length})</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {list.length === 0 && <div className="empty" style={{ padding: "20px 0" }}>今天还没有安排<br />点击时间轴或 + 添加</div>}
          {list.map((e) => {
            const s = subjOf(subjects, e.subjectId);
            const c = Dv.eventCompletion(e);
            return (
              <div key={e.id} onClick={() => onEvent(e)}

}
