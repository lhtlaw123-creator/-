  <script type="text/babel">
/* ============ 备考日历 · 视图 (月/周/日) ============ */
const Dv = window.CalData;

function subjOf(subjects, id) { return subjects.find((s) => s.id === id) || subjects[0]; }

/* ---------- 月视图 ---------- */
function MonthView({ anchor, events, subjects, settings, onDay, onEvent, onAdd }) {
  const cells = Dv.monthGrid(anchor);
  const t = Dv.today();
  const byDay = useMemo(() => {
    const m = {};
    events.forEach((e) => { (m[e.date] = m[e.date] || []).push(e); });
    Object.values(m).forEach((l) => l.sort((a, b) => (a.start || "99").localeCompare(b.start || "99")));
    return m;
  }, [events]);

  return (
    <div className="month">
      <div className="weekhead">
        {Dv.DOW_CN.map((d, i) => <div key={d} className={i >= 5 ? "we" : ""}>{d}</div>)}
      </div>
      <div className="monthgrid">
        {cells.map((date) => {
          const list = byDay[date] || [];
          const ds = Dv.dayStats(events, date, settings.dailyGoalMin);
          const dim = date.slice(0, 7) !== anchor.slice(0, 7);
          const isToday = date === t;
          const maxShow = 3;
          return (
            <div key={date} className={"daycell" + (dim ? " dim" : "") + (isToday ? " today" : "")}
              onClick={() => onDay(date)} onDoubleClick={() => onAdd(date)}>
              <div className="dc-top">
                <span className={"dc-num" + (isToday ? " todaynum" : "")}>{+date.slice(8)}</span>
                {ds.planned > 0 && <span className="dc-min tnum">{Dv.fmtMin(ds.planned)}</span>}
              </div>
              <div className="dc-events">
                {list.slice(0, maxShow).map((e) => {
                  const s = subjOf(subjects, e.subjectId);
                  const done = Dv.isEventDone(e);
                  return (
                    <div key={e.id} className={"evpill" + (done ? " done" : "")}
                      style={{ background: s.fill, color: s.ink }}
                      onClick={(ev) => { ev.stopPropagation(); onEvent(e); }}>
                      <span className="evpill-check" style={{ borderColor: s.solid, background: done ? s.solid : "transparent" }} />
                      <span className="evpill-t">{e.title}</span>
                    </div>
                  );
                })}
                {list.length > maxShow && <div className="dc-more">+{list.length - maxShow} 更多</div>}
              </div>
              {ds.planned > 0 && (
                <div className="dc-ring">
                  <Ring value={ds.ratio} size={20} stroke={3}
                    color={ds.ratio >= 1 ? "oklch(0.72 0.16 150)" : "var(--accent)"} />
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- 时间轴（周/日共用） ---------- */
const HOUR_H = 56;
const START_HOUR = 6;
const END_HOUR = 24;

function layoutDay(list) {
  // 为有时间的事件计算重叠列布局
  const timed = list.filter((e) => e.start).map((e) => {
    const s = Dv.timeToMin(e.start);
    return { e, s, end: s + (e.durationMin || 30) };
  }).sort((a, b) => a.s - b.s || a.end - b.end);
  // 分组重叠
  const cols = [];
  timed.forEach((it) => {
    let placed = false;
    for (const col of cols) {
      if (col[col.length - 1].end <= it.s) { col.push(it); it.col = cols.indexOf(col); placed = true; break; }
    }
    if (!placed) { it.col = cols.length; cols.push([it]); }
  });
  const ncol = Math.max(1, cols.length);
  timed.forEach((it) => (it.ncol = ncol));
  const untimed = list.filter((e) => !e.start);
  return { timed, untimed };
}

function NowLine({ date }) {
  const [, force] = useState(0);
  useEffect(() => { const i = setInterval(() => force((x) => x + 1), 60000); return () => clearInterval(i); }, []);
  if (date !== Dv.today()) return null;
  const now = new Date();
  const min = now.getHours() * 60 + now.getMinutes();
  if (min < START_HOUR * 60 || min > END_HOUR * 60) return null;
  const top = ((min - START_HOUR * 60) / 60) * HOUR_H;
  return <div className="tl-now" style={{ top }} />;
}

function TimelineEvent({ it, subjects, onEvent, onPatch, days, dayIndex }) {
  const { e } = it;
  const s = subjOf(subjects, e.subjectId);
  const done = Dv.isEventDone(e);
  const baseTop = ((it.s - START_HOUR * 60) / 60) * HOUR_H;
  const baseH = Math.max(22, ((e.durationMin || 30) / 60) * HOUR_H - 3);
  const w = 100 / it.ncol;
  const comp = Dv.eventCompletion(e);
  const elRef = useRef(null);
  const [drag, setDrag] = useState(null); // {mode, top, h, leftShift, label}

  const MPP = 60 / HOUR_H;          // 每像素多少分钟
  const snap = (m) => Math.round(m / 30) * 30; // 吸附到 30 分钟

  const startDrag = (mode) => (ev) => {
    if (ev.button != null && ev.button !== 0) return;
    ev.stopPropagation();
    ev.preventDefault();
    const col = elRef.current && elRef.current.closest(".tl-col");
    const colW = col ? col.getBoundingClientRect().width : 1;
    const x0 = ev.clientX, y0 = ev.clientY;
    const origStart = it.s, origDur = e.durationMin || 30;
    let moved = false, last = null;
    const onMove = (mv) => {
      const dx = mv.clientX - x0, dy = mv.clientY - y0;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      if (mode === "move") {
        let ns = snap(origStart + dy * MPP);
        ns = Math.max(START_HOUR * 60, Math.min(ns, END_HOUR * 60 - origDur));
        let di = dayIndex;
        if (days.length > 1) di = Math.max(0, Math.min(days.length - 1, dayIndex + Math.round(dx / colW)));
        last = { date: days[di], start: Dv.minToTime(ns) };
        setDrag({ mode, top: ((ns - START_HOUR * 60) / 60) * HOUR_H, h: baseH, leftShift: (di - dayIndex) * 100, label: Dv.minToTime(ns) + (days.length > 1 ? " · 周" + Dv.DOW_CN[Dv.dow(days[di])] : "") });
      } else {
        let nd = snap(origDur + dy * MPP);
        nd = Math.max(30, Math.min(nd, END_HOUR * 60 - origStart));
        last = { durationMin: nd };
        setDrag({ mode, top: baseTop, h: Math.max(22, (nd / 60) * HOUR_H - 3), leftShift: 0, label: Dv.fmtMin(nd) });
      }
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      setDrag(null);
      if (!moved) { onEvent(e); return; }
      if (last && onPatch) onPatch(e.id, last);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  };

  const top = drag ? drag.top : baseTop;
  const h = drag ? drag.h : baseH;
  const leftPct = it.col * w + (drag ? drag.leftShift : 0);
  return (
    <div ref={elRef} className={"tl-event" + (done ? " done" : "") + (drag ? " dragging" : "")}
      style={{
        top, height: h, left: `calc(${leftPct}% + 3px)`, width: `calc(${w}% - 6px)`,
        background: s.fill, color: s.ink, borderLeftColor: s.solid,
        zIndex: drag ? 50 : undefined,
      }}
      onPointerDown={startDrag("move")}>
      <div className="te-title">{done ? "✓ " : ""}{e.title}</div>
      {h > 34 && <div className="te-meta tnum">{drag ? drag.label : (e.start + " · " + Dv.fmtMin(e.durationMin) + (comp.total ? ` · ${comp.done}/${comp.total}` : ""))}</div>}
      <div className="te-resize" onPointerDown={startDrag("resize")} title="拖动调整时长" />
    </div>
  );
}

function Timeline({ days, events, subjects, settings, onEvent, onAdd, onDayHeader, onPatch }) {
  const scrollRef = useRef(null);
  const t = Dv.today();
  const hours = [];
  for (let h = START_HOUR; h < END_HOUR; h++) hours.push(h);

  useEffect(() => {
    // 滚动到 7:30 左右
    if (scrollRef.current) scrollRef.current.scrollTop = 1.2 * HOUR_H;
  }, [days[0]]);

  const byDay = useMemo(() => {
    const m = {};
    days.forEach((d) => (m[d] = layoutDay(events.filter((e) => e.date === d))));
    return m;
  }, [events, days.join()]);

  const colTemplate = `56px repeat(${days.length}, 1fr)`;

  return (
    <div className="timeline-wrap">
      <div className="tl-head" style={{ gridTemplateColumns: colTemplate }}>
        <div className="tl-corner" />
        {days.map((d) => {
          const ds = Dv.dayStats(events, d, settings.dailyGoalMin);
          const isT = d === t;
          const di = Dv.dow(d);
          return (
            <div className="tl-head-cell" key={d} style={{ cursor: onDayHeader ? "pointer" : "default" }}
              onClick={() => onDayHeader && onDayHeader(d)}>
              <div className="tl-dow" style={di >= 5 ? { color: "oklch(0.7 0.1 25)" } : null}>周{Dv.DOW_CN[di]}</div>
              <div className={"tl-date" + (isT ? " today" : "")}>{+d.slice(8)}</div>
              <div style={{ display: "flex", justifyContent: "center", marginTop: 4 }}>
                <Ring value={ds.ratio} size={26} stroke={3.5}
                  color={ds.ratio >= 1 ? "oklch(0.72 0.16 150)" : "var(--accent)"}>
                  {ds.planned > 0 && <span className="tnum" style={{ fontSize: 8.5, color: "var(--ink-2)", fontWeight: 700 }}>{Math.round(ds.ratio * 100)}</span>}
                </Ring>
              </div>
            </div>
          );
        })}
      </div>
      <div className="tl-scroll" ref={scrollRef}>
        <div className="tl-grid" style={{ gridTemplateColumns: colTemplate, minHeight: hours.length * HOUR_H }}>
          <div className="tl-hours">
            {hours.map((h) => (
              <div className="tl-hour-label" key={h}><span className="tnum">{Dv.pad(h)}:00</span></div>
            ))}
          </div>
          {days.map((d) => {
            const { timed, untimed } = byDay[d];
            return (
              <div className="tl-col" key={d}>
                {hours.map((h) => (
                  <div className="tl-hour-line" key={h}
                    onClick={() => onAdd(d, Dv.minToTime(h * 60))} style={{ cursor: "copy" }} />
                ))}
                {timed.map((it) => <TimelineEvent key={it.e.id} it={it} subjects={subjects} onEvent={onEvent} onPatch={onPatch} days={days} dayIndex={days.indexOf(d)} />)}
                <NowLine date={d} />
                {untimed.length > 0 && (
                  <div style={{ position: "absolute", top: 2, left: 3, right: 3, display: "flex", flexDirection: "column", gap: 2 }}>
                    {untimed.map((e) => {
                      const s = subjOf(subjects, e.subjectId);
                      return <div key={e.id} className="evpill" style={{ background: s.fill, color: s.ink }} onClick={() => onEvent(e)}>
                        <span className="evpill-t">{e.title}</span></div>;
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function WeekView(props) {
  const days = Dv.weekDays(props.anchor);
  return <Timeline days={days} {...props} onDayHeader={props.onDay} />;
}

/* ---------- 日视图：时间轴 + 当日清单焦点 ---------- */
function DayView({ anchor, events, subjects, settings, onEvent, onAdd, onPatch }) {
  const list = useMemo(() => events.filter((e) => e.date === anchor)
    .sort((a, b) => (a.start || "99").localeCompare(b.start || "99")), [events, anchor]);
  const ds = Dv.dayStats(events, anchor, settings.dailyGoalMin);
  const totalTodo = list.reduce((a, e) => a + (e.todos ? e.todos.length : 0), 0);
  const doneTodo = list.reduce((a, e) => a + (e.todos ? e.todos.filter((t) => t.done).length : 0), 0);

  return (
    <div style={{ flex: 1, display: "flex", minHeight: 0 }}>
      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
        <Timeline days={[anchor]} events={events} subjects={subjects} settings={settings} onEvent={onEvent} onAdd={onAdd} onPatch={onPatch} />
      </div>
      <div style={{ width: 300, flexShrink: 0, borderLeft: "1px solid var(--line)", padding: "20px 18px", overflowY: "auto", background: "var(--surface-2)" }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", paddingBottom: 18, borderBottom: "1px solid var(--line)" }}>
          <Ring value={ds.ratio} size={128} stroke={12} glow
            color={ds.ratio >= 1 ? "oklch(0.72 0.16 150)" : "var(--accent)"}>
            <div>
              <div className="font-display tnum" style={{ fontSize: 30, fontWeight: 700, lineHeight: 1 }}>{Math.round(ds.ratio * 100)}<small style={{ fontSize: 15 }}>%</small></div>
              <div style={{ fontSize: 11, color: "var(--ink-2)", marginTop: 3 }}>今日目标</div>
            </div>
          </Ring>
          <div className="tnum" style={{ marginTop: 14, fontSize: 13.5, color: "var(--ink-2)" }}>
            已完成 <b style={{ color: "var(--ink)" }}>{Dv.fmtMin(ds.doneMin)}</b> / 计划 {Dv.fmtMin(ds.planned)}
          </div>
          <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 4 }}>目标 {Dv.fmtMin(settings.dailyGoalMin)} · 待办 {doneTodo}/{totalTodo}</div>
        </div>
        <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--ink-3)", letterSpacing: 1, margin: "16px 2px 10px" }}>当日任务 ({list.length})</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {list.length === 0 && <div className="empty" style={{ padding: "20px 0" }}>今天还没有安排<br />点击时间轴或 + 添加</div>}
          {list.map((e) => {
            const s = subjOf(subjects, e.subjectId);
            const c = Dv.eventCompletion(e);
            return (
              <div key={e.id} onClick={() => onEvent(e)}
                style={{ background: "var(--surface)", borderRadius: "var(--r-md)", padding: "10px 12px", cursor: "pointer", boxShadow: "var(--shadow-sm)", borderLeft: `3px solid ${s.solid}`, transition: "transform .15s var(--ease)" }}
                onMouseEnter={(ev) => ev.currentTarget.style.transform = "translateX(2px)"}
                onMouseLeave={(ev) => ev.currentTarget.style.transform = "none"}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 11, color: s.ink, background: s.fill, padding: "1px 7px", borderRadius: 99, fontWeight: 600 }}>{s.name}</span>
                  <span className="tnum" style={{ fontSize: 11.5, color: "var(--ink-3)", marginLeft: "auto" }}>{e.start || "—"} · {Dv.fmtMin(e.durationMin)}</span>
                </div>
                <div style={{ fontSize: 14, fontWeight: 600, marginTop: 5, textDecoration: Dv.isEventDone(e) ? "line-through" : "none", opacity: Dv.isEventDone(e) ? 0.5 : 1 }}>{e.title}</div>
                {c.total > 0 && (
                  <div className="todo-prog" style={{ marginTop: 7, marginBottom: 0 }}>
                    <div className="todo-bar"><i style={{ width: `${c.ratio * 100}%`, background: s.solid }} /></div>
                    <span className="tnum" style={{ fontSize: 11, color: "var(--ink-3)" }}>{c.done}/{c.total}</span>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { MonthView, WeekView, DayView, Timeline, subjOf });

</script>
  <script type="text/babel">
/* ============ 备考日历 · 座右铭 / 多倒计时 / 每日备忘 / 侧边栏 ============ */
const Db = window.CalData;

/* ---------- F1 座右铭横幅（神圣激励感，可编辑） ---------- */
function MottoBar({ motto, onChange }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(motto || "");
  const ref = useRef(null);
  useEffect(() => { setDraft(motto || ""); }, [motto]);
  useEffect(() => { if (editing && ref.current) { ref.current.focus(); ref.current.select(); } }, [editing]);
  const commit = () => { onChange((draft || "").trim()); setEditing(false); };
  return (
    <div className="motto-bar">
      <span className="motto-orn left">✦</span>
      {editing ? (
        <input ref={ref} className="motto-input" value={draft} maxLength={60}
          onChange={(e) => setDraft(e.target.value)} onBlur={commit}
          onKeyDown={(e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") { setDraft(motto || ""); setEditing(false); } }} />
      ) : (
        <button className="motto-text" onClick={() => setEditing(true)} title="点击编辑你的座右铭">
          {motto || "写下一句激励自己的话 ——"}
        </button>
      )}
      <span className="motto-orn right">✦</span>
    </div>
  );
}

/* ---------- F2 多倒计时卡（滚轮切换 + 点击管理） ---------- */
function CountdownCard({ countdowns, active, setActive, onManage }) {
  const list = countdowns && countdowns.length ? countdowns : [];
  const idx = Math.min(active || 0, Math.max(0, list.length - 1));
  const cd = list[idx];
  const wheelLock = useRef(0);
  const onWheel = (e) => {
    if (list.length < 2) return;
    e.preventDefault();
    const now = Date.now();
    if (now - wheelLock.current < 220) return;
    wheelLock.current = now;
    const dir = e.deltaY > 0 ? 1 : -1;
    setActive((idx + dir + list.length) % list.length);
  };
  if (!cd) {
    return <div className="countdown empty-cd" onClick={onManage}><div className="cd-label">点击添加倒计时</div><div className="cd-num font-display">＋</div></div>;
  }
  const daysLeft = Db.daysBetween(Db.today(), cd.date);
  return (
    <div className="countdown" onClick={onManage} onWheel={onWheel} title="滚轮切换 · 点击管理">
      <div className="cd-row">
        <div className="cd-label">{cd.emoji ? cd.emoji + " " : ""}距 {cd.name} 还有</div>
        {list.length > 1 && <span className="cd-wheel-hint">滚轮切换</span>}
      </div>
      <div className="cd-num font-display tnum">
        {daysLeft >= 0 ? daysLeft : "已过"}<small>{daysLeft >= 0 ? "天" : ""}</small>
      </div>
      <div className="cd-foot">
        <span className="cd-exam tnum">{cd.date}</span>
        {list.length > 1 && (
          <span className="cd-dots">
            {list.map((_, i) => <i key={i} className={i === idx ? "on" : ""} />)}
          </span>
        )}
      </div>
    </div>
  );
}

const CD_EMOJI = ["⚖️", "📚", "✍️", "🎓", "📝", "🏛️", "⏰", "🔥", "🌟", "🎯"];

function CountdownManager({ countdowns, onChange, onClose }) {
  const [show, setShow] = useState(false);
  const [list, setList] = useState(countdowns.map((c) => ({ ...c })));
  useEffect(() => { const t = setTimeout(() => setShow(true), 10); return () => clearTimeout(t); }, []);
  const close = () => { onClose(); };
  const commit = (next) => { setList(next); onChange(next); };
  const patch = (id, p) => commit(list.map((c) => (c.id === id ? { ...c, ...p } : c)));
  const add = () => commit([...list, { id: Db.uid("c"), name: "新目标", date: Db.addDays(Db.today(), 30), emoji: CD_EMOJI[list.length % CD_EMOJI.length] }]);
  const del = (id) => commit(list.filter((c) => c.id !== id));

  return (
    <React.Fragment>
      <div className={"scrim" + (show ? " show" : "")} onClick={close} />
      <div className={"drawer" + (show ? " show" : "")} style={{ width: 420 }}>
        <div className="drawer-head">
          <Icon name="clock" size={20} style={{ marginTop: 3 }} />
          <div className="font-display" style={{ fontSize: 20, fontWeight: 700, flex: 1 }}>倒计时管理</div>
          <button className="icon-btn" onClick={close} title="关闭侧边栏"><Icon name="close" /></button>
        </div>
        <div className="drawer-body">
          <p style={{ fontSize: 13, color: "var(--ink-2)", lineHeight: 1.6, margin: "0 0 14px" }}>
            可添加多个倒计时（各类考试、报名截止…）。在侧边栏卡片上<b>滚动鼠标滚轮</b>即可快速切换查看。
          </p>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {list.map((c) => {
              const d = Db.daysBetween(Db.today(), c.date);
              return (
                <div key={c.id} className="cd-edit-card">
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <select className="cd-emoji-sel" value={c.emoji || ""} onChange={(e) => patch(c.id, { emoji: e.target.value })}>
                      {CD_EMOJI.map((em) => <option key={em} value={em}>{em}</option>)}
                    </select>
                    <input className="input" style={{ flex: 1, fontWeight: 600 }} value={c.name}
                      onChange={(e) => patch(c.id, { name: e.target.value })} placeholder="名称" />
                    <button className="icon-btn" onClick={() => del(c.id)} style={{ color: "oklch(0.62 0.16 25)" }}><Icon name="trash" size={15} /></button>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 9 }}>
                    <input type="date" className="input tnum" style={{ flex: 1 }} value={c.date} onChange={(e) => patch(c.id, { date: e.target.value })} />
                    <span className="tnum" style={{ fontSize: 13, fontWeight: 700, color: d >= 0 ? "var(--accent-ink)" : "var(--ink-3)", whiteSpace: "nowrap" }}>
                      {d >= 0 ? `还有 ${d} 天` : "已过期"}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
          <button className="btn btn-soft" style={{ marginTop: 14, width: "100%", justifyContent: "center" }} onClick={add}>
            <Icon name="plus" size={15} /> 添加倒计时
          </button>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------- F4 每日备忘录（可打勾） ---------- */
function MemoBox({ memos, onChange }) {
  const [adding, setAdding] = useState("");
  const addRef = useRef(null);
  const done = memos.filter((m) => m.done).length;
  const toggle = (id) => onChange(memos.map((m) => (m.id === id ? { ...m, done: !m.done } : m)));
  const del = (id) => onChange(memos.filter((m) => m.id !== id));
  const add = () => {
    const v = adding.trim(); if (!v) return;
    onChange([...memos, { id: Db.uid("m"), text: v, done: false, date: Db.today() }]);
    setAdding(""); setTimeout(() => addRef.current && addRef.current.focus(), 10);
  };
  const clearDone = () => onChange(memos.filter((m) => !m.done));

  return (
    <div className="memo-box">
      <div className="memo-head">
        <Icon name="check" size={13} stroke={2.6} />
        <span>每日备忘</span>
        {memos.length > 0 && <span className="memo-count tnum">{done}/{memos.length}</span>}
        {done > 0 && <button className="memo-clear" onClick={clearDone} title="清除已完成">清除</button>}
      </div>
      <div className="memo-list">
        {memos.map((m) => (
          <div className="memo-item" key={m.id}>
            <div className={"memo-check" + (m.done ? " on" : "")} onClick={() => toggle(m.id)}>
              <Icon name="check" size={11} stroke={3} />
            </div>
            <span className={"memo-text" + (m.done ? " done" : "")} onClick={() => toggle(m.id)}>{m.text}</span>
            <button className="memo-del" onClick={() => del(m.id)}><Icon name="close" size={12} /></button>
          </div>
        ))}
        <div className="memo-add">
          <div className="memo-check dashed" onClick={() => addRef.current && addRef.current.focus()}><Icon name="plus" size={11} stroke={2.6} /></div>
          <input ref={addRef} value={adding} placeholder="记一件事…"
            onChange={(e) => setAdding(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") add(); }} onBlur={add} />
        </div>
      </div>
    </div>
  );
}

/* ---------- 侧边栏 ---------- */
function Sidebar({ collapsed, state, setState, anchor, onManageCountdown, onReviewSubject, toggleSubject }) {
  const { subjects, events, settings } = state;
  const weekFrom = Db.startOfWeek(anchor), weekTo = Db.addDays(weekFrom, 6);
  const { map } = useMemo(() => Db.rangeStats(events, subjects, weekFrom, weekTo), [events, subjects, weekFrom]);
  const hidden = settings.hiddenSubjects || [];
  const groups = Db.GROUP_ORDER.map((g) => [g, subjects.filter((s) => s.group === g)]);

  return (
    <div className={"sidebar" + (collapsed ? " collapsed" : "")}>
      <CountdownCard countdowns={state.countdowns} active={settings.activeCountdown}
        setActive={(i) => setState((s) => ({ ...s, settings: { ...s.settings, activeCountdown: i } }))}
        onManage={onManageCountdown} />

      <MemoBox memos={state.memos || []} onChange={(memos) => setState((s) => ({ ...s, memos }))} />

      <div className="side-title">科目 · 本周时长 <span style={{ fontWeight: 500, textTransform: "none", letterSpacing: 0 }}>点击回顾</span></div>
      {groups.map(([g, list]) => (
        <div key={g}>
          <div className="subj-group-name">{g}</div>
          {list.map((s) => {
            const mins = map[s.id] ? map[s.id].plannedMin : 0;
            const off = hidden.includes(s.id);
            return (
              <div key={s.id} className={"subj-item" + (off ? " off" : "")} onClick={() => onReviewSubject(s.id)}>
                <span className="subj-dot" style={{ background: s.solid }} onClick={(e) => { e.stopPropagation(); toggleSubject(s.id); }} title="点圆点：在日历中显示/隐藏" />
                <span className="subj-name">{s.name}</span>
                <span className="subj-min tnum">{mins ? Db.fmtMin(mins) : ""}</span>
                <Icon name="next" size={13} />
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

Object.assign(window, { MottoBar, CountdownCard, CountdownManager, MemoBox, Sidebar });

</script>
  <script type="text/babel">
/* ============ 备考日历 · F3 科目目标回顾（月→周，百分比） ============ */
const Drv = window.CalData;

function pct(r) { return Math.round((r || 0) * 100); }
function ringColor(r) { return r >= 1 ? "oklch(0.72 0.16 150)" : r >= 0.6 ? "var(--accent)" : "oklch(0.74 0.14 30)"; }

function SubjectReviewModal({ subjectId, state, setState, onClose }) {
  const [show, setShow] = useState(false);
  const [openMonth, setOpenMonth] = useState(Drv.today().slice(0, 7));
  useEffect(() => { const t = setTimeout(() => setShow(true), 10); return () => clearTimeout(t); }, []);
  const close = () => { onClose(); };

  const subj = state.subjects.find((s) => s.id === subjectId) || state.subjects[0];
  const review = useMemo(() => Drv.subjectReview(state, subjectId, 4), [state, subjectId]);
  const hidden = (state.settings.hiddenSubjects || []).includes(subjectId);

  // 总览：近4个月合计
  const totDone = review.reduce((a, m) => a + m.doneMin, 0);
  const totTodo = review.reduce((a, m) => a + m.todoTotal, 0);
  const totTodoDone = review.reduce((a, m) => a + m.todoDone, 0);
  const totGoalH = review.reduce((a, m) => a + (m.goalH || 0), 0);
  const overallRatio = totTodo ? totTodoDone / totTodo : 0;

  const monthLabel = (mk) => `${+mk.slice(5, 7)}月`;
  const setMonthGoal = (mk, h) => setState((s) => {
    const mg = { ...(s.monthlyGoals || {}) };
    const arr = (mg[mk] || []).slice();
    const i = arr.findIndex((g) => g.subjectId === subjectId);
    if (i >= 0) arr[i] = { ...arr[i], totalHours: h };
    else arr.push({ id: Drv.uid("g"), subjectId, totalHours: h, subItems: [] });
    mg[mk] = arr;
    return { ...s, monthlyGoals: mg };
  });

  return (
    <React.Fragment>
      <div className={"scrim" + (show ? " show" : "")} onClick={close} />
      <div className={"modal" + (show ? " show" : "")} style={{ width: 660 }}>
        <div className="modal-head">
          <span className="subj-dot" style={{ background: subj.solid, width: 20, height: 20 }} />
          <div className="modal-title">{subj.name}<span style={{ fontSize: 13, color: "var(--ink-3)", fontWeight: 500, marginLeft: 10 }}>{subj.group} · 目标回顾</span></div>
          <div className="spacer" />
          <button className={"btn " + (hidden ? "btn-soft" : "btn-ghost")} onClick={() => setState((s) => {
            const set = new Set(s.settings.hiddenSubjects || []);
            set.has(subjectId) ? set.delete(subjectId) : set.add(subjectId);
            return { ...s, settings: { ...s.settings, hiddenSubjects: [...set] } };
          })} style={{ fontSize: 12.5 }}>{hidden ? "已隐藏 · 点击显示" : "在日历中显示"}</button>
          <button className="icon-btn" onClick={close} title="关闭侧边栏"><Icon name="close" /></button>
        </div>
        <div className="modal-body">
          {/* 总览 */}
          <div className="rv-overview" style={{ background: subj.fill }}>
            <Ring value={overallRatio} size={92} stroke={10} glow color={subj.solid}>
              <div><div className="font-display tnum" style={{ fontSize: 26, fontWeight: 700, lineHeight: 1, color: subj.ink }}>{pct(overallRatio)}<small style={{ fontSize: 13 }}>%</small></div><div style={{ fontSize: 10, color: subj.ink, opacity: 0.7 }}>近4月完成率</div></div>
            </Ring>
            <div className="rv-kpis">
              <div><b className="font-display tnum" style={{ color: subj.ink }}>{Drv.fmtHrs(totDone)}h</b><span>累计学习</span></div>
              <div><b className="font-display tnum" style={{ color: subj.ink }}>{totTodoDone}/{totTodo}</b><span>待办完成</span></div>
              <div><b className="font-display tnum" style={{ color: subj.ink }}>{totGoalH || "—"}{totGoalH ? "h" : ""}</b><span>目标合计</span></div>
            </div>
          </div>
          <p style={{ fontSize: 12.5, color: "var(--ink-3)", margin: "0 2px 14px", lineHeight: 1.5 }}>
            完成率口径 = 每日 to-do 清单完成数 ÷ 总数。以月为总体，可展开看每周明细。
          </p>

          {/* 逐月 */}
          {review.map((m) => {
            const isOpen = openMonth === m.monthKey;

  <script type="text/babel">
/* ============ 备考日历 · 统计面板 ============ */
const Ds = window.CalData;

const GROUP_NOTE = { "法考": "客观题各科", "法学课程": "期末考课程", "保研": "" };

/* ---- 概览（时长 + 完成，单周期） ---- */
function OverviewPanel({ events, subjects, settings, anchor }) {
  const [cycle, setCycle] = useState("week");
  const [from, to, cycleLabel] = useMemo(() => {
    if (cycle === "today") return [Ds.today(), Ds.today(), "今日"];
    if (cycle === "week") { const s = Ds.startOfWeek(anchor); return [s, Ds.addDays(s, 6), "本周"]; }
    if (cycle === "month") { return [Ds.startOfMonth(anchor), Ds.endOfMonth(anchor), "本月"]; }
    if (cycle === "exam") {
      const t = Ds.today(), ed = settings.examDate || Ds.addDays(t, 90);
      return [t < ed ? t : ed, t < ed ? ed : t, "至考试"];
    }
    return ["0000-01-01", "9999-12-31", "全部"];
  }, [cycle, anchor, settings.examDate]);

  const { map, totPlanned, totDone, totTodo, totTodoDone } = useMemo(
    () => Ds.rangeStats(events, subjects, from, to), [events, subjects, from, to]);
  const rows = subjects.map((s) => ({ s, ...map[s.id] })).sort((a, b) => b.plannedMin - a.plannedMin);
  const active = rows.filter((r) => r.plannedMin > 0 || r.count > 0);
  const maxMin = Math.max(60, ...active.map((r) => r.plannedMin));
  const days = Math.max(1, Ds.daysBetween(from, to) + 1);
  const overallTodoRatio = totTodo ? totTodoDone / totTodo : 0;

  return (
    <React.Fragment>
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 16 }}>
        <div className="cycle-seg">
          {[["today", "今日"], ["week", "本周"], ["month", "本月"], ["exam", "至考试"], ["all", "全部"]].map(([k, l]) => (
            <button key={k} className={cycle === k ? "on" : ""} onClick={() => setCycle(k)}>{l}</button>
          ))}
        </div>
      </div>
      <div className="stat-overview">
        <Ring value={settings.dailyGoalMin ? Math.min(1, totDone / (settings.dailyGoalMin * days)) : overallTodoRatio}
          size={108} stroke={11} glow color="var(--accent)">
          <div>
            <div className="font-display tnum" style={{ fontSize: 26, fontWeight: 700, lineHeight: 1 }}>{Ds.fmtHrs(totDone)}<small style={{ fontSize: 13 }}>h</small></div>
            <div style={{ fontSize: 10.5, color: "var(--ink-2)", marginTop: 3 }}>已完成时长</div>
          </div>
        </Ring>
        <div className="stat-kpis">
          <div><div className="kpi-num tnum">{Ds.fmtHrs(totPlanned)}<small>h</small></div><div className="kpi-label">{cycleLabel}计划时长</div></div>
          <div><div className="kpi-num tnum">{Math.round(overallTodoRatio * 100)}<small>%</small></div><div className="kpi-label">待办完成率 ({totTodoDone}/{totTodo})</div></div>
          <div><div className="kpi-num tnum">{Ds.fmtHrs(days ? totDone / days : 0)}<small>h</small></div><div className="kpi-label">日均学习</div></div>
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "4px 4px 12px" }}>

}

/* ---- 完成率追踪：今日 / 本周 / 本月 三栏，按科目 + 分组汇总 ---- */
function periodRange(kind) {
  const t = Ds.today();
  if (kind === "today") return [t, t];
  if (kind === "week") { const s = Ds.startOfWeek(t); return [s, Ds.addDays(s, 6)]; }
  return [Ds.startOfMonth(t), Ds.endOfMonth(t)];
}

function TrackCell({ done, total, color, today }) {
  if (!total) {
    return <div className="track-empty">{today ? <span>—<br /><small>未设清单</small></span> : "—"}</div>;
  }
  const ratio = done / total;
  return (
    <div className="track-cell">
      <Ring value={ratio} size={36} stroke={4.5} color={ratio >= 1 ? "oklch(0.72 0.16 150)" : color}>
        <span className="tnum" style={{ fontSize: 11, fontWeight: 700, color: "var(--ink)" }}>{Math.round(ratio * 100)}</span>
      </Ring>
      <span className="tc-frac">{done}/{total}</span>
    </div>
  );
}

function CompletionTracker({ events, subjects }) {
  const periods = ["today", "week", "month"];
  const maps = useMemo(() => {
    const o = {};
    periods.forEach((p) => { const [f, t] = periodRange(p); o[p] = Ds.rangeStats(events, subjects, f, t).map; });
    return o;
  }, [events, subjects]);

  const groups = Ds.GROUP_ORDER.map((g) => [g, subjects.filter((s) => s.group === g)]);
  const agg = (period, list) => {
    let d = 0, tot = 0;
    list.forEach((s) => { const m = maps[period][s.id]; d += m.todoDone; tot += m.todoTotal; });
    return { d, tot };
  };

  return (
    <React.Fragment>
      <p style={{ fontSize: 13, color: "var(--ink-2)", lineHeight: 1.6, margin: "0 0 16px", background: "var(--surface-2)", padding: "12px 16px", borderRadius: "var(--r-md)" }}>
        每个科目<b>待办清单 (to-do) 的完成比例</b> —— 今日告诉你清单设了没、完成了多少;本周、本月则汇总整段时间的完成率。
        每组(法考 / 期末 / 保研)顶部为该组的整体完成率。
      </p>
      <div className="track-grid">
        <div className="track-colhead">
          <div>科目</div><div>今日</div><div>本周</div><div>本月</div>
        </div>
        {groups.map(([g, list]) => {
          if (list.length === 0) return null;
          return (
            <div className="track-group" key={g}>
              <div className="track-group-name">
                <b>{g}</b>
                {GROUP_NOTE[g] && <span className="gn-note">· {GROUP_NOTE[g]}</span>}
                <span className="gn-line" />
              </div>
              <div className="track-grp-cell" style={{ display: "flex", alignItems: "center", fontSize: 12, color: "var(--ink-3)", fontWeight: 600 }}>整体完成率</div>
              {periods.map((p) => {
                const { d, tot } = agg(p, list);
                const ratio = tot ? d / tot : 0;
                return (
                  <div className="track-grp-cell" key={p}>
                    {tot ? (
                      <div className="track-grpring">
                        <Ring value={ratio} size={30} stroke={4} color={ratio >= 1 ? "oklch(0.72 0.16 150)" : "var(--accent)"}>
                          <span className="tnum" style={{ fontSize: 10, fontWeight: 700 }}>{Math.round(ratio * 100)}</span>
                        </Ring>
                        <span className="tg-frac">{d}/{tot}</span>
                      </div>
                    ) : <div className="track-empty" style={{ minHeight: 30 }}>—</div>}
                  </div>
                );
              })}
              {list.map((s) => (
                <div className="track-row" key={s.id}>
                  <div className="track-name">
                    <span className="subj-dot" style={{ background: s.solid }} />
                    <span style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.name}</span>
                  </div>
                  {periods.map((p) => {
                    const m = maps[p][s.id];
                    return <div key={p}><TrackCell done={m.todoDone} total={m.todoTotal} color={s.solid} today={p === "today"} /></div>;
                  })}
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </React.Fragment>
  );
}

function StatsModal({ events, subjects, settings, anchor, onClose }) {
  const [show, setShow] = useState(false);
  const [tab, setTab] = useState("overview"); // overview | tracker
  useEffect(() => { const t = setTimeout(() => setShow(true), 10); return () => clearTimeout(t); }, []);

  return (
    <React.Fragment>
      <div className={"scrim" + (show ? " show" : "")} onClick={close} />
      <div className={"modal" + (show ? " show" : "")}>
        <div className="modal-head">

          <div className="spacer" />
          <div className="cycle-seg">
            <button className={tab === "overview" ? "on" : ""} onClick={() => setTab("overview")}>时长 · 完成</button>
            <button className={tab === "tracker" ? "on" : ""} onClick={() => setTab("tracker")}>完成率追踪</button>
          </div>
          <button className="icon-btn" onClick={close} title="关闭侧边栏"><Icon name="close" /></button>
        </div>
        <div className="modal-body">
          {tab === "overview"
            ? <OverviewPanel events={events} subjects={subjects} settings={settings} anchor={anchor} />
            : <CompletionTracker events={events} subjects={subjects} />}
        </div>
      </div>
    </React.Fragment>
  );
}

/* 语音识别 hook */
function useVoice(onText) {
  const recRef = useRef(null);
  const [listening, setListening] = useState(false);
  const supported = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
  const toggle = () => {
    if (!supported) return;
    if (listening) { recRef.current && recRef.current.stop(); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = "zh-CN"; rec.interimResults = true; rec.continuous = false;
    let finalT = "";
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalT += r[0].transcript; else interim += r[0].transcript;
      }
      onText(finalT + interim);
    };
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    recRef.current = rec;
    try { rec.start(); setListening(true); } catch (e) { setListening(false); }
  };
  return { listening, toggle, supported: !!supported };
}

  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, [msgs, busy]);
  const close = () => { onClose(); };

  const send = async (text) => {
    const q = (text != null ? text : input).trim();
    if (!q || busy) return;
    setInput("");
    setMsgs((m) => [...m, { role: "user", text: q }]);
    setBusy(true);
    if (!Dai.aiAvailable(state)) {
      setMsgs((m) => [...m, { role: "ai", text: "⚠️ 还没接入 AI。请点右上角「设置」选择 AI 服务商（如 DeepSeek / OpenAI / Claude）并填入 API Key，即可在任意浏览器里使用 AI 排课。", needKey: true }]);
      setBusy(false); return;
    }
    try {
      // 智能判断：排课指令 vs 通用问答
      const scheduleKw = /排|安排|添加|加一节|挪到|删除|取消|改|调整|计划|日程|课|节|学习块|几点|小时|分钟|每天|每周/g;
      const isSchedule = scheduleKw.test(q);
      const prompt = isSchedule ? buildSchedulePrompt(state, q) : buildChatPrompt(state, q);
      const raw = await Dai.aiComplete(prompt, state.settings, "chat");
      if (isSchedule) {
        const data = parseJSONLoose(raw);
        if (!data || !Array.isArray(data.actions)) {
          setMsgs((m) => [...m, { role: "ai", text: raw && raw.trim() ? raw.trim() : "我没太理解，换种说法再试一次？（比如指明科目、日期、时长）" }]);
          setBusy(false); return;
        }
        const snapshot = state.events;
        const { events, summary } = Dai.applyActions(state, data.actions);
        setState((s) => ({ ...s, events }));
        setMsgs((m) => [...m, { role: "ai", text: data.reply || "已更新日程", summary, undo: snapshot }]);
        toast && toast(`已更新 ${summary.length} 项日程`);
      } else {
        setMsgs((m) => [...m, { role: "ai", text: raw && raw.trim() ? raw.trim() : "请再说一遍？" }]);
      }
    } catch (e) {
      setMsgs((m) => [...m, { role: "ai", text: "出错了：" + (e.message || e) + "，稍后再试。" }]);
    }
    setBusy(false);
  };

  const undo = (snapshot, idx) => {
    setState((s) => ({ ...s, events: snapshot }));
    setMsgs((m) => m.map((mm, i) => (i === idx ? { ...mm, undone: true } : mm)));
    toast && toast("已撤销");
  };

  return (
    <React.Fragment>
      <div className={"ai-panel" + (show ? " show" : "")}>
        <div className="ai-head">
          <div className="ai-mark"><Icon name="flame" size={16} /></div>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: "var(--font-display)", fontSize: 16, fontWeight: 700 }}>AI 助手</div>
            <div style={{ fontSize: 11, color: "var(--ink-3)" }}>说一句话，我帮你改日历</div>
          </div>
          <button className="icon-btn" title="上传文件解析" onClick={() => { setShowFileParse(!showFileParse); setFileResult(null); }}><Icon name="download" size={16} /></button>
          <button className="icon-btn" title="清空对话" onClick={() => { if (confirm("确定清空所有对话记录？此操作不可撤销，云端同步的对话数据也将一并清除。")) { setState((s) => ({ ...s, aiChatHistory: [] })); setMsgs([{ role: "ai", text: "对话已清空。我是你的备考全能助手 ✦ 可以帮你排课、回答法律问题、规划学习策略。试试：「刑法中的因果关系怎么理解？」" }]); toast && toast("所有对话记录已清空"); } }} style={{ color: "oklch(0.6 0.16 25)" }}><Icon name="trash" size={15} /></button>
          <button className="icon-btn" onClick={close} title="关闭侧边栏"><Icon name="close" /></button>
        </div>
        <div className="ai-body" ref={bodyRef}>
          {msgs.map((m, i) => (
            <div key={i} className={"ai-msg " + m.role}>
              <div className={"ai-bubble " + m.role}>
                {m.text}
                {m.summary && m.summary.length > 0 && !m.undone && (
                  <div className="ai-changes">
                    {m.summary.map((s, k) => (
                      <div key={k} className={"ai-change " + s.op}>
                        <span className="acd" />{s.text}
                      </div>
                    ))}
                  </div>
                )}
                {m.undo && !m.undone && (
                  <button className="ai-undo" onClick={() => undo(m.undo, i)}>↩ 撤销这次更改</button>
                )}
                {m.undone && <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginTop: 6 }}>已撤销</div>}
              </div>
            </div>
          ))}
          {busy && <div className="ai-msg ai"><div className="ai-bubble ai ai-typing"><i /><i /><i /></div></div>}
        </div>
        {msgs.length <= 1 && !initialMsg && (
          <div className="ai-quick">
            {QUICK.map((q) => <button key={q} onClick={() => send(q)}>{q}</button>)}
          </div>
        )}
        {/* 文件上传解析 */}
        {showFileParse && (
          <div className="ai-file-parse">
            <div className="ai-file-parse-head">
              <Icon name="book" size={15} /> 上传文件，AI 提取学习目标
              <button className="icon-btn" onClick={() => { setShowFileParse(false); setFileResult(null); }} style={{ marginLeft: "auto" }}><Icon name="close" size={14} /></button>
            </div>
            {!fileResult ? (
              <React.Fragment>
                <label className="ai-file-label">
                  <input type="file" accept=".txt,.md,.csv,.json,.docx,.pdf" style={{ display: "none" }}
                    onChange={async (e) => {
                      const f = e.target.files && e.target.files[0];
                      if (!f) return;
                      setFileBusy(true);
                      try {
                        const text = await new Promise((resolve, reject) => {
                          const reader = new FileReader();
                          reader.onload = () => resolve(reader.result);
                          reader.onerror = reject;
                          if (f.name.endsWith(".pdf") || f.name.endsWith(".docx")) {
                            // 二进制文件：只取文件名，让 AI 根据文件名推测
                            resolve("（二进制文件，无法直接读取文本内容）\n文件名：" + f.name);
                          } else {
                            reader.readAsText(f, "UTF-8");
                          }
                        });
                        if (!Dai.aiAvailable(state)) {
                          setFileResult({ error: "请先在设置里配置 AI（API Key）" });
                          setFileBusy(false);
                          return;
                        }
                        const prompt = buildFileParsePrompt(state, text, f.name);
                        const raw = await Dai.aiComplete(prompt, state.settings, "chat");
                        const data = parseJSONLoose(raw);
                        if (data && data.goals && data.goals.length) {
                          setFileResult({ goals: data.goals, fileName: f.name });
                        } else {
                          setFileResult({ error: "未能从文件中提取到学习目标，请检查文件内容。" });
                        }
                      } catch (err) {
                        setFileResult({ error: "解析失败：" + (err.message || err) });
                      }
                      setFileBusy(false);
                      e.target.value = "";
                    }} />
                  <Icon name="download" size={14} /> 选择文件（.txt .md .csv）
                </label>
                {fileBusy && <div className="ai-file-busy"><div className="ai-typing"><i /><i /><i /></div> AI 正在分析文件…</div>}
              </React.Fragment>
            ) : fileResult.error ? (
              <div className="ai-file-error">
                <p>{fileResult.error}</p>
                <button className="btn btn-soft" onClick={() => setFileResult(null)}>重试</button>
              </div>
            ) : (
              <div className="ai-file-goals">
                <p style={{ fontSize: 12.5, color: "var(--ink-2)", margin: "0 0 6px" }}>
                  从「{fileResult.fileName}」中提取到 {fileResult.goals.length} 个学习目标，确认后加入日程：
                </p>
                {fileResult.goals.map((g, i) => (
                  <div className="ai-file-goal" key={i}>
                    <div><strong>{g.subject}</strong> · {g.title}</div>
                    <div style={{ fontSize: 11.5, color: "var(--ink-2)" }}>
                      {Dai.fmtMin(g.durationMin || 120)} · 待办：{(g.todos || []).join("、")}
                    </div>
                  </div>
                ))}
                <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                  <button className="btn btn-accent" style={{ flex: 1 }} onClick={() => {
                    const today = Dai.today();
                    const newEvents = fileResult.goals.map((g, i) => ({
                      id: Dai.uid("ev"),
                      date: Dai.addDays(today, i),
                      subject: g.subject,
                      title: g.title,
                      start: null,
                      durationMin: g.durationMin || 120,
                      todos: (g.todos || []).map((t) => ({ text: t, done: false })),
                    }));
                    setState((s) => ({ ...s, events: [...s.events, ...newEvents] }));
                    setMsgs((m) => [...m,
                      { role: "user", text: "上传并解析了文件「" + fileResult.fileName + "」" },
                      { role: "ai", text: "已提取 " + fileResult.goals.length + " 个学习目标并加入日程（从今天起依次排布）" },
                    ]);
                    toast && toast("已添加 " + fileResult.goals.length + " 个学习目标");
                    setShowFileParse(false); setFileResult(null);
                  }}>确认并加入日程</button>
                  <button className="btn btn-ghost" onClick={() => setFileResult(null)}>放弃</button>
                </div>
              </div>
            )}
          </div>
        )}

        <div className="ai-input">
          {supported && (
            <button className={"ai-mic" + (listening ? " on" : "")} onClick={toggle} title="语音输入">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3" /><path d="M5 10a7 7 0 0 0 14 0" /><line x1="12" y1="19" x2="12" y2="22" />
              </svg>
            </button>
          )}
          <input value={input} placeholder={listening ? "聆听中…" : "输入指令，回车发送"} disabled={busy}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") send(); }} />
          <button className="ai-send" onClick={() => send()} disabled={busy || !input.trim()}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></svg>
          </button>
        </div>
      </div>
    </React.Fragment>
  );
}

window.AssistantPanel = AssistantPanel;
window.parseJSONLoose = parseJSONLoose;

</script>
  <script type="text/babel">
/* ============ 备考日历 · 每周规划（按科目设大目标） ============ */
const Dp = window.CalData;
const WD_FULL = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

function GoalEditor({ subjects, hidden, goal, onChange, onRemove }) {
  const subj = subjects.find((s) => s.id === goal.subjectId) || subjects[0];
  const groups = Dp.GROUP_ORDER.map((g) => [g, subjects.filter((s) => s.group === g)]);
  const todoText = (goal.dailyTodos || []).join("\n");
  return (
    <div className="goal-card" style={{ borderLeft: `4px solid ${subj.solid}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
        <span className="subj-dot" style={{ background: subj.solid, width: 15, height: 15 }} />
        <select className="input" style={{ width: "auto", flex: 1, padding: "7px 11px", fontWeight: 600 }}
          value={goal.subjectId} onChange={(e) => onChange({ ...goal, subjectId: e.target.value })}>
          {groups.map(([g, list]) => (
            <optgroup key={g} label={g}>
              {list.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
            </optgroup>
          ))}
        </select>
        <button className="icon-btn" onClick={onRemove}><Icon name="trash" size={15} /></button>
      </div>
      <div className="row" style={{ gap: 14, alignItems: "flex-end" }}>
        <div style={{ flex: "0 0 auto" }}>
          <label className="field-label" style={{ marginBottom: 5 }}>本周目标时长</label>
          <div style={{ display: "flex", alignItems: "baseline", gap: 4 }}>
            <input type="number" min="1" max="60" step="0.5" className="input tnum"
              style={{ width: 76, fontFamily: "var(--font-display)", fontSize: 20, fontWeight: 700, padding: "6px 10px" }}
              value={goal.goalHours} onChange={(e) => onChange({ ...goal, goalHours: +e.target.value })} />
            <span style={{ fontSize: 14, color: "var(--ink-2)", fontWeight: 600 }}>小时</span>
          </div>
        </div>
        <div style={{ flex: 1 }}>
          <label className="field-label" style={{ marginBottom: 5 }}>安排在这些天</label>
          <div className="wd-pick">
            {WD_FULL.map((w, i) => (
              <button key={i} className={(goal.weekdays || []).includes(i) ? "on" : ""}
                onClick={() => {
                  const set = new Set(goal.weekdays || []);
                  set.has(i) ? set.delete(i) : set.add(i);
                  onChange({ ...goal, weekdays: [...set].sort() });
                }} style={(goal.weekdays || []).includes(i) ? { background: subj.solid, color: "#fff" } : null}>{w[1]}</button>
            ))}
          </div>
        </div>
        <div style={{ flex: "0 0 auto" }}>
          <label className="field-label" style={{ marginBottom: 5 }}>每天开始</label>
          <input type="time" className="input tnum" style={{ width: 110, padding: "7px 10px" }}
            value={goal.startTime || ""} onChange={(e) => onChange({ ...goal, startTime: e.target.value || null })} />
        </div>
      </div>
      <div style={{ marginTop: 12 }}>
        <label className="field-label" style={{ marginBottom: 5 }}>每日待办模板（每行一条，会预设进每天的 to-do）</label>
        <textarea className="input" style={{ minHeight: 52, fontSize: 13.5 }} placeholder={"看课 1 节\n真题 30 道\n错题整理"}
          value={todoText} onChange={(e) => onChange({ ...goal, dailyTodos: e.target.value.split("\n").map((x) => x.trim()).filter(Boolean) })} />
      </div>
      {(goal.weekdays || []).length > 0 && goal.goalHours > 0 && (
        <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 8 }}>
          → 生成 {goal.weekdays.length} 天，每天约 <b style={{ color: subj.ink }}>{Dp.fmtMin(Math.round(goal.goalHours * 60 / goal.weekdays.length))}</b>
        </div>
      )}
    </div>
  );
}

function WeeklyPlanner({ state, setState, onClose, toast, initialWeek }) {
  const [show, setShow] = useState(false);
  const [week, setWeek] = useState(initialWeek || Dp.weekKey(Dp.today()));
  const [goals, setGoals] = useState(() => (state.weeklyPlans[week] || []).map((g) => ({ ...g })));
  useEffect(() => { const t = setTimeout(() => setShow(true), 10); return () => clearTimeout(t); }, []);
  useEffect(() => { setGoals((state.weeklyPlans[week] || []).map((g) => ({ ...g }))); }, [week]);
  const close = () => { onClose(); };

  const weekEnd = Dp.addDays(week, 6);
  const label = `${(+week.slice(5, 7))}月${(+week.slice(8))}日 – ${(+weekEnd.slice(5, 7))}月${(+weekEnd.slice(8))}日`;
  const visibleSubjects = state.subjects;
  const hidden = state.settings.hiddenSubjects || [];

  const addGoal = () => {
    const used = new Set(goals.map((g) => g.subjectId));
    const s = state.subjects.find((x) => !used.has(x.id)) || state.subjects[0];
    setGoals((g) => [...g, { id: Dp.uid("g"), subjectId: s.id, goalHours: 10, weekdays: [0, 1, 2, 3, 4], startTime: "20:00", dailyTodos: [] }]);
  };
  const savePlan = (next) => {
    setGoals(next);
    setState((st) => ({ ...st, weeklyPlans: { ...st.weeklyPlans, [week]: next } }));
  };
  const updateGoal = (id, g) => savePlan(goals.map((x) => (x.id === id ? g : x)));
  const removeGoal = (id) => savePlan(goals.filter((x) => x.id !== id));

  const generate = () => {
    savePlan(goals);
    let created = 0;
    setState((st) => {
      let events = st.events.slice();
      // 移除本周由规划生成的旧事件（标记 planId），避免重复
      events = events.filter((e) => !(e.planWeek === week));
      goals.forEach((g) => {
        const days = (g.weekdays || []);
        if (!days.length || !g.goalHours) return;
        const per = Math.max(15, Math.round(g.goalHours * 60 / days.length));
        const subj = st.subjects.find((s) => s.id === g.subjectId);
        days.forEach((wd) => {
          const date = Dp.addDays(week, wd);
          events.push({
            id: Dp.uid("e"), date, subjectId: g.subjectId,
            title: `${subj.name} · 周目标`, start: g.startTime || null, durationMin: per,
            done: false, notes: "", planWeek: week,
            todos: (g.dailyTodos || []).map((t) => ({ id: Dp.uid("t"), text: t, done: false })),
          });
          created++;
        });
      });
      return { ...st, events };
    });
    toast && toast(`已生成 ${created} 个学习块`);
  };

  const progress = useMemo(() => {
    const { map } = Dp.rangeStats(state.events, state.subjects, week, weekEnd);
    return goals.map((g) => {
      const m = map[g.subjectId] || { plannedMin: 0, doneMin: 0 };
      return { g, goalMin: Math.round(g.goalHours * 60), planned: m.plannedMin, done: m.doneMin };
    });
  }, [goals, state.events, week]);

  return (
    <React.Fragment>
      <div className={"scrim" + (show ? " show" : "")} onClick={close} />
      <div className={"modal" + (show ? " show" : "")} style={{ width: 760 }}>
        <div className="modal-head">
          <Icon name="target" size={22} />
          <div className="modal-title">每周规划</div>
          <div className="nav-group" style={{ marginLeft: 6 }}>
            <button className="icon-btn" onClick={() => setWeek(Dp.addDays(week, -7))}><Icon name="prev" size={16} /></button>
            <span className="tnum" style={{ fontSize: 13.5, fontWeight: 600, minWidth: 132, textAlign: "center" }}>{label}</span>
            <button className="icon-btn" onClick={() => setWeek(Dp.addDays(week, 7))}><Icon name="next" size={16} /></button>
          </div>
          <div className="spacer" />
          <button className="icon-btn" onClick={close} title="关闭侧边栏"><Icon name="close" /></button>
        </div>
        <div className="modal-body">
          <p style={{ fontSize: 13, color: "var(--ink-2)", lineHeight: 1.6, margin: "0 0 16px" }}>
            为本周挑选科目并设定<b>大目标时长</b>（如：刑法 20 小时）。点「生成本周日程」后会自动把时长拆到选定的每天、并预设好待办；这些时长会<b>自动汇总到周/月统计与分析报告</b>。
          </p>
          {goals.length === 0 && <div className="empty" style={{ padding: "26px" }}>本周还没有规划目标<br />点下面「添加科目目标」开始</div>}
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {goals.map((g) => (
              <GoalEditor key={g.id} subjects={visibleSubjects} hidden={hidden} goal={g}
                onChange={(ng) => updateGoal(g.id, ng)} onRemove={() => removeGoal(g.id)} />
            ))}
          </div>
          <button className="btn btn-soft" style={{ marginTop: 14 }} onClick={addGoal}><Icon name="plus" size={15} /> 添加科目目标</button>

          {progress.length > 0 && (
            <React.Fragment>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: "var(--ink-3)", letterSpacing: 1, margin: "22px 2px 10px" }}>本周目标进度</div>
              {progress.map(({ g, goalMin, planned, done }) => {
                const subj = state.subjects.find((s) => s.id === g.subjectId);
                const planRatio = goalMin ? Math.min(1, planned / goalMin) : 0;
                const doneRatio = goalMin ? Math.min(1, done / goalMin) : 0;
                return (
                  <div className="subj-stat-row" key={g.id} style={{ gridTemplateColumns: "120px 1fr auto" }}>
                    <div className="subj-stat-name"><span className="subj-dot" style={{ background: subj.solid }} />{subj.name}</div>
                    <div className="sbar" title={`目标 ${Dp.fmtHrs(goalMin)}h · 已排 ${Dp.fmtHrs(planned)}h · 已完成 ${Dp.fmtHrs(done)}h`}>
                      <i style={{ width: `${planRatio * 100}%`, background: subj.line }} />
                      <i style={{ width: `${doneRatio * 100}%`, background: subj.solid, marginTop: -9 }} />
                    </div>
                    <div className="subj-stat-fig"><div className="big tnum" style={{ color: subj.ink }}>{Dp.fmtHrs(done)}/{Dp.fmtHrs(goalMin)}h</div><div className="sm">目标完成 {Math.round(doneRatio * 100)}%</div></div>
                  </div>
                );
              })}
            </React.Fragment>
          )}
        </div>
        <div className="drawer-foot" style={{ borderTop: "1px solid var(--line)" }}>
          <span style={{ fontSize: 12, color: "var(--ink-3)" }}>生成会覆盖本周由规划创建的旧学习块</span>
          <div className="spacer" />
          <button className="btn btn-soft" onClick={close}>关闭</button>
          <button className="btn btn-accent" onClick={generate} disabled={!goals.length}><Icon name="check" size={15} stroke={2.6} /> 生成本周日程</button>
        </div>
      </div>
    </React.Fragment>
  );
}

window.WeeklyPlanner = WeeklyPlanner;

</script>
  <script type="text/babel">
/* ============ 备考日历 · AI 学习分析报告（周/月 → PDF） ============ */
/* F5 科目可增删改 · F6 月总目标拆分为子项，逐项设定时长并分析 */
const Dr = window.CalData;

function gatherReport(state, mode, anchor) {
  let from, to, label, key, store;
  if (mode === "month") { from = Dr.startOfMonth(anchor); to = Dr.endOfMonth(anchor); label = "本月"; key = Dr.monthKey(anchor); store = "monthlyGoals"; }
  else { from = Dr.weekKey(anchor); to = Dr.addDays(from, 6); label = "本周"; key = Dr.weekKey(anchor); store = "weeklyGoals"; }
  const { map } = Dr.rangeStats(state.events, state.subjects, from, to);
  const days = [];
  const n = Dr.daysBetween(from, to) + 1;
  for (let i = 0; i < n; i++) {
    const d = Dr.addDays(from, i);
    const ds = Dr.dayStats(state.events, d, state.settings.dailyGoalMin);
    days.push({ date: d, planned: ds.planned, done: ds.doneMin });
  }
  return { from, to, label, key, store, map, days };
}

// 真实数据（按科目）：已学时长 / 待办完成率（来自每日 to-do）
function realFor(map, row) {
  if (row.subjectId && map[row.subjectId]) {
    const m = map[row.subjectId];
    return { doneMin: m.doneMin, plannedMin: m.plannedMin, todoDone: m.todoDone, todoTotal: m.todoTotal,
      todoRatio: m.todoTotal ? m.todoDone / m.todoTotal : 0 };
  }
  return { doneMin: 0, plannedMin: 0, todoDone: 0, todoTotal: 0, todoRatio: 0 };
}

// 根据已存目标 + 实际数据，构建可编辑目标行
function buildGoalRows(state, gathered) {
  const stored = (state[gathered.store] || {})[gathered.key];
  if (stored && stored.length) return stored.map(cloneRow);
  // 首次：用有数据的科目预填，子项留空，总目标按实际取整估值
  const rows = [];
  state.subjects.forEach((s) => {
    const m = gathered.map[s.id];
    if (m && (m.plannedMin > 0 || m.count > 0)) {
      rows.push({ id: Dr.uid("g"), subjectId: s.id, name: s.name,
        totalHours: Math.max(1, Math.round(m.plannedMin / 60)), subItems: [] });
    }
  });
  return rows;
}
function cloneRow(r) { return { ...r, subItems: (r.subItems || []).map((x) => ({ ...x })) }; }

function subItemDone(row) { return (row.subItems || []).reduce((a, x) => a + (+x.done || 0), 0); }
function subItemTarget(row) { return (row.subItems || []).reduce((a, x) => a + (+x.hours || 0), 0); }

// 本地兜底分析（无 AI 时）
function localAnalyze(rows, map, days, label) {
  let totTarget = 0, totDone = 0;
  const subjects = rows.map((r) => {
    const real = realFor(map, r);
    const target = r.totalHours || subItemTarget(r) || 0;
    const done = (r.subItems && r.subItems.length) ? subItemDone(r) : real.doneMin / 60;
    totTarget += target; totDone += done;
    const ratio = target ? Math.min(1, done / target) : 0;
    const subItems = (r.subItems || []).map((si) => {
      const sr = si.hours ? Math.min(1, (+si.done || 0) / si.hours) : 0;
      let c;
      if (sr >= 1) c = "已达成";
      else if (sr >= 0.5) c = `进行中（${Math.round(sr * 100)}%），继续推进`;
      else if (+si.done > 0) c = `刚起步（${Math.round(sr * 100)}%），需加力`;
      else c = "尚未开始，优先安排";
      return { name: si.name, comment: c };
    });
    let c;
    if (ratio >= 1) c = `已达成 ${target}h 目标，待办完成率 ${Math.round(real.todoRatio * 100)}%。`;
    else c = `目标 ${target}h，已完成 ${done.toFixed(1)}h（${Math.round(ratio * 100)}%），待办完成 ${Math.round(real.todoRatio * 100)}%。`;
    return { name: r.name, comment: c, subItems };
  });
  const activeDays = days.filter((d) => d.done > 0).length;
  const overallRatio = totTarget ? Math.min(1, totDone / totTarget) : 0;
  const score = Math.round(Math.min(100, overallRatio * 60 + (activeDays / Math.max(1, days.length)) * 40));
  const wins = [], risks = [], suggestions = [];
  if (overallRatio >= 0.7) wins.push(`目标整体达成 ${Math.round(overallRatio * 100)}%，执行到位`);
  if (activeDays >= days.length * 0.7) wins.push(`${days.length} 天中 ${activeDays} 天有推进`);
  rows.forEach((r) => {
    const target = r.totalHours || subItemTarget(r);
    const done = (r.subItems && r.subItems.length) ? subItemDone(r) : realFor(map, r).doneMin / 60;
    if (target && done < target * 0.6) risks.push(`${r.name} 距 ${target}h 目标还差 ${(target - done).toFixed(1)}h`);
    (r.subItems || []).forEach((si) => { if (si.hours && (+si.done || 0) < si.hours * 0.4) risks.push(`${r.name}·${si.name} 进度偏慢`); });
  });
  if (days.length - activeDays > 0) suggestions.push(`有 ${days.length - activeDays} 天空白，下阶段保持每天都有推进`);
  suggestions.push("把落后子项拆成更小的每日待办，交给 AI 排进日历");
  suggestions.push("达成快的子项可适当压缩，把时间让给薄弱子项");
  return {
    headline: score >= 75 ? "本阶段执行得不错，继续保持" : score >= 50 ? "完成了一部分，仍有空间" : "进度偏慢，需要收紧节奏",
    score, overall: `${label}设定目标合计 ${totTarget.toFixed(1)}h、已完成 ${totDone.toFixed(1)}h（${Math.round(overallRatio * 100)}%）；${days.length} 天中 ${activeDays} 天有效推进。`,
    subjects, wins: wins.length ? wins : ["保持了基本学习投入"], risks: risks.length ? risks : ["暂无明显风险，注意持续性"], suggestions,
  };
}

const SUBITEM_PRESETS = ["看课", "精读法条", "背诵记忆", "真题练习", "错题整理", "案例分析", "模拟测试", "笔记总结"];

/* ---------- 目标行编辑卡 ---------- */
function GoalRow({ row, subjects, usedSubjectIds, realDone, onChange, onRemove }) {
  const subj = row.subjectId ? subjects.find((s) => s.id === row.subjectId) : null;
  const color = subj ? subj.solid : "var(--ink-3)";
  const groups = Dr.GROUP_ORDER.map((g) => [g, subjects.filter((s) => s.group === g)]);
  const sumTarget = subItemTarget(row);
  const sumDone = subItemDone(row);

  const setSub = (id, p) => onChange({ ...row, subItems: row.subItems.map((x) => (x.id === id ? { ...x, ...p } : x)) });
  const addSub = () => {
    const used = (row.subItems || []).map((x) => x.name);
    const preset = SUBITEM_PRESETS.find((p) => !used.includes(p)) || "新子项";
    onChange({ ...row, subItems: [...(row.subItems || []), { id: Dr.uid("si"), name: preset, hours: 2, done: 0 }] });
  };
  const delSub = (id) => onChange({ ...row, subItems: row.subItems.filter((x) => x.id !== id) });

  return (
    <div className="goal-card" style={{ borderLeft: `4px solid ${color}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span className="subj-dot" style={{ background: color, width: 14, height: 14, flexShrink: 0 }} />
        <select className="input" style={{ width: "auto", flex: 1, padding: "7px 10px", fontWeight: 600 }}
          value={row.subjectId || "__custom"}
          onChange={(e) => {
            if (e.target.value === "__custom") onChange({ ...row, subjectId: null });
            else { const s = subjects.find((x) => x.id === e.target.value); onChange({ ...row, subjectId: s.id, name: s.name }); }
          }}>
          {groups.map(([g, list]) => (
            <optgroup key={g} label={g}>
              {list.map((s) => <option key={s.id} value={s.id} disabled={usedSubjectIds.includes(s.id) && s.id !== row.subjectId}>{s.name}</option>)}
            </optgroup>
          ))}
          <option value="__custom">＋ 自定义科目…</option>
        </select>
        {!row.subjectId && (
          <input className="input" style={{ flex: 1, fontWeight: 600 }} value={row.name} placeholder="自定义科目名"
            onChange={(e) => onChange({ ...row, name: e.target.value })} />
        )}
        <div style={{ display: "flex", alignItems: "baseline", gap: 3, flexShrink: 0 }}>
          <span style={{ fontSize: 12, color: "var(--ink-2)" }}>月总目标</span>
          <input type="number" min="0" step="1" className="input tnum" style={{ width: 58, padding: "6px 8px", fontWeight: 700, fontFamily: "var(--font-display)", fontSize: 16 }}
            value={row.totalHours != null ? row.totalHours : ""} onChange={(e) => onChange({ ...row, totalHours: +e.target.value })} />
          <span style={{ fontSize: 12, color: "var(--ink-2)" }}>h</span>
        </div>
        <button className="icon-btn" onClick={onRemove} style={{ color: "oklch(0.62 0.16 25)", flexShrink: 0 }}><Icon name="trash" size={15} /></button>
      </div>

      {/* 子项 */}
      <div className="subitem-wrap">
        {(row.subItems || []).length > 0 && (
          <div className="subitem-head">
            <span style={{ flex: 1 }}>子项</span><span style={{ width: 96, textAlign: "center" }}>目标 / 已完成 (h)</span><span style={{ width: 28 }} />
          </div>
        )}
        {(row.subItems || []).map((si) => (
          <div className="subitem-row" key={si.id}>
            <input className="subitem-name" value={si.name} placeholder="子项名称"
              onChange={(e) => setSub(si.id, { name: e.target.value })} />
            <div className="subitem-nums">
              <input type="number" min="0" step="0.5" className="input tnum" value={si.hours != null ? si.hours : ""}
                onChange={(e) => setSub(si.id, { hours: +e.target.value })} />
              <span>/</span>
              <input type="number" min="0" step="0.5" className="input tnum" value={si.done != null ? si.done : ""}
                onChange={(e) => setSub(si.id, { done: +e.target.value })} />
            </div>
            <button className="icon-btn" style={{ width: 28, height: 28 }} onClick={() => delSub(si.id)}><Icon name="close" size={13} /></button>
          </div>
        ))}
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 7 }}>
          <button className="subitem-add" onClick={addSub}><Icon name="plus" size={13} stroke={2.4} /> 拆分子项</button>
          {sumTarget > 0 && (
            <span style={{ fontSize: 11.5, color: sumTarget > (row.totalHours || 0) ? "oklch(0.62 0.15 30)" : "var(--ink-3)" }}>
              子项合计 {sumTarget}h{row.totalHours ? ` / 总目标 ${row.totalHours}h` : ""} · 已完成 {sumDone}h
            </span>
          )}
          {sumTarget === 0 && <span style={{ fontSize: 11.5, color: "var(--ink-3)" }}>已学 {Dr.fmtHrs(realDone)}h（来自日历实际）</span>}
        </div>
      </div>
    </div>
  );
}

// 格式：全文宋体四号(14pt)，除一级标题(h4)外全部首行缩进，行距1.5
function generatePrintHTML(analysis, rows, state, gathered, totDone, totTarget, activeDays) {
  const esc = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  let bodyHtml = '';

  // 封面标题
  bodyHtml += '<div class="cover"><h1>备考日历 · ' + esc(gathered.label) + '学习分析报告</h1>';
  bodyHtml += '<p class="subtitle">' + esc(analysis.headline) + '</p>';
  bodyHtml += '<p class="date">' + esc(gathered.from) + ' 至 ' + esc(gathered.to) + '</p>';
  bodyHtml += '<div class="kpi-row"><div class="kpi"><b>' + totDone.toFixed(1) + 'h</b><span>已完成</span></div>';
  bodyHtml += '<div class="kpi"><b>' + totTarget.toFixed(0) + 'h</b><span>目标合计</span></div>';
  bodyHtml += '<div class="kpi"><b>' + (totTarget ? Math.round(Math.min(1, totDone / totTarget) * 100) : 0) + '%</b><span>达成率</span></div>';
  bodyHtml += '<div class="kpi"><b>' + activeDays + '/' + gathered.days.length + '</b><span>学习天数</span></div></div>';
  bodyHtml += '<div class="score">表现评分：' + (analysis.score || 0) + '分</div></div>';

  // 整体概览
  bodyHtml += '<h4>一、整体概览</h4>';
  (analysis.overall || '').split('\n').filter(Boolean).forEach((line) => {
    bodyHtml += '<p>' + esc(line.trim()) + '</p>';
  });

  // 总结（深度分析）
  if (analysis.summary) {
    bodyHtml += '<h4>二、总体评价</h4>';
    (analysis.summary || '').split('\n').filter(Boolean).forEach((line) => {
      bodyHtml += '<p>' + esc(line.trim()) + '</p>';
    });
  }

  // 各科目深度分析
  const sectionIdx = analysis.summary ? '三' : '二';
  bodyHtml += '<h4>' + sectionIdx + '、各科目深度分析</h4>';
  rows.forEach((r, ri) => {
    const target = r.totalHours || (r.subItems || []).reduce((a, x) => a + (+x.hours || 0), 0);
    const done = (r.subItems && r.subItems.length) ? (r.subItems || []).reduce((a, x) => a + (+x.done || 0), 0) : 0;
    const ratio = target ? Math.min(1, done / target) : 0;
    const ai = (analysis.subjects || []).find((x) => x.name === r.name || (x.name && r.name.includes(x.name)));
    bodyHtml += '<h5>' + (ri + 1) + '. ' + esc(r.name || '未命名') + '（已完成 ' + done.toFixed(1) + 'h / 目标 ' + (target || '—') + 'h，' + Math.round(ratio * 100) + '%）</h5>';
    if (ai && ai.comment) bodyHtml += '<p>' + esc(ai.comment) + '</p>';
    (r.subItems || []).forEach((si) => {
      const sai = ai && ai.subItems && ai.subItems.find((x) => x.name === si.name || (x.name && si.name.includes(x.name)));
      bodyHtml += '<p class="subitem"><strong>' + esc(si.name) + '</strong>：' + (si.done || 0) + '/' + si.hours + 'h';
      if (sai && sai.comment) bodyHtml += ' — ' + esc(sai.comment);
      bodyHtml += '</p>';
    });
  });

  // 亮点
  const nextIdx1 = analysis.summary ? '四' : '三';
  bodyHtml += '<h4>' + nextIdx1 + '、亮点</h4>';
  (analysis.wins || []).forEach((w) => { bodyHtml += '<p>' + esc(w) + '</p>'; });

  // 风险
  const nextIdx2 = analysis.summary ? '五' : '四';
  bodyHtml += '<h4>' + nextIdx2 + '、风险与落后点</h4>';
  (analysis.risks || []).forEach((w) => { bodyHtml += '<p>' + esc(w) + '</p>'; });

  // 趋势
  if (analysis.trend) {
    const nextIdx3 = analysis.summary ? '六' : '五';
    bodyHtml += '<h4>' + nextIdx3 + '、趋势判断</h4>';
    bodyHtml += '<p>' + esc(analysis.trend) + '</p>';
  }

  // 建议
  const suggestIdx = analysis.summary ? (analysis.trend ? '七' : '六') : (analysis.trend ? '六' : '五');
  bodyHtml += '<h4>' + suggestIdx + '、下阶段建议</h4>';
  (analysis.suggestions || []).forEach((w, i) => {
    bodyHtml += '<p>' + (i + 1) + '. ' + esc(w) + '</p>';
  });

  // 页脚
  bodyHtml += '<div class="footer">—— 由备考日历生成 · ' + Dr.today() + '</div>';

  // 完整 HTML 文档
  return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>备考日历 · ' + esc(gathered.label) + '学习分析报告</title><style>'
    + '@page { margin: 20mm 25mm; size: A4; }'
    + '* { box-sizing: border-box; }'
    + 'body { font-family: "Songti SC", "SimSun", "STSong", "宋体", serif; font-size: 14pt; line-height: 1.5; color: #222; max-width: 100%; }'
    + 'h1 { font-size: 22pt; font-weight: 700; text-align: center; margin: 0 0 8px; letter-spacing: 2px; }'
    + '.cover { text-align: center; margin-bottom: 36px; padding-bottom: 28px; border-bottom: 2px solid #333; }'
    + '.subtitle { font-size: 15pt; color: #555; margin: 6px 0; }'
    + '.date { font-size: 12pt; color: #888; margin: 4px 0 20px; }'
    + '.kpi-row { display: flex; justify-content: center; gap: 32px; margin: 18px 0; }'
    + '.kpi { text-align: center; }'
    + '.kpi b { display: block; font-size: 18pt; font-weight: 700; }'
    + '.kpi span { font-size: 10pt; color: #666; }'
    + '.score { font-size: 13pt; margin-top: 10px; color: #444; }'
    + 'h4 { font-size: 16pt; font-weight: 700; margin: 28px 0 12px; padding-bottom: 4px; border-bottom: 1px solid #ddd; }'
    + 'h5 { font-size: 14pt; font-weight: 700; margin: 16px 0 8px; }'
    + 'p { text-indent: 2em; margin: 0 0 8px; text-align: justify; }'
    + 'p.subitem { text-indent: 2em; font-size: 13pt; margin-left: 1em; }'
    + '.footer { text-align: right; font-size: 10pt; color: #999; margin-top: 40px; padding-top: 12px; border-top: 1px solid #ddd; }'
    + '@media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }'
    + '</style></head><body>' + bodyHtml + '</body></html>';
}
