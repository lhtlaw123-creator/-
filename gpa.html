<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能学分绩点计算器</title>
    <script>
        (function () {
            try {
                var login = localStorage.getItem("beikao-cal-login");
                if (!login || login === "1") {
                    location.replace("./index.html");
                }
            } catch (e) {
                location.replace("./index.html");
            }
        })();
    </script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用于解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Chart.js 用于绘制动态折线图 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style id="custom-style">
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        /* 隐藏数字输入框的箭头 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        /* 自定义滚动条 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 图标组件 ---
        const GraduationCap = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
        );
        const Calculator = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
        );
        const RotateCcw = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        );
        const TrendingUp = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        );
        const TrendingDown = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
        );
        const Minus = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>
        );
        const Plus = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        );
        const Trash2 = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        );
        const Scale = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>
        );
        const Swords = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="10"/><line x1="4" y1="16" x2="8" y2="20"/><line x1="3" y1="19" x2="5" y2="21"/></svg>
        );
        const LineChartIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        );
        const X = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        );
        const Download = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );

        // --- 主程序组件 ---
        // --- 主程序组件 ---
        const App = () => {
            // 模式控制: 'regular', 'plan', 'competitor'
            const [mode, setMode] = useState('regular');

            // --- 尝试读取保存的状态 ---
            const savedState = window.__SAVED_STATE__ || {};

            // --- 1. 常规模式 & 共有基础数据 ---
            const [baseCredits, setBaseCredits] = useState(savedState.baseCredits || '109');
            const [baseScore, setBaseScore] = useState(savedState.baseScore || '91.93');
            const [courses, setCourses] = useState(savedState.courses || [{ id: Date.now(), name: '', credit: '', score: '' }]);
            
            // 常规模式计算结果
            const [result, setResult] = useState(null);
            const [diff, setDiff] = useState(0);
            const [termStats, setTermStats] = useState({ credits: 0, avg: 0 });

            // --- 2. 方案对比数据 ---
            const [planA, setPlanA] = useState(savedState.planA || { credits: '', score: '' });
            const [planB, setPlanB] = useState(savedState.planB || { credits: '', score: '' });

            // --- 3. 竞争对手对比数据 ---
            const [compBaseCredits, setCompBaseCredits] = useState(savedState.compBaseCredits || '110');
            const [compBaseScore, setCompBaseScore] = useState(savedState.compBaseScore || '91.50');
            const [myTermData, setMyTermData] = useState(savedState.myTermData || { credits: '', score: '' });
            const [compTermData, setCompTermData] = useState(savedState.compTermData || { credits: '', score: '' });
            
            // --- 图表分析模态框控制 ---
            const [showDynamicChart, setShowDynamicChart] = useState(false);
            const chartRef1 = useRef(null);
            const chartRef2 = useRef(null);
            const [insight1, setInsight1] = useState("");
            const [insight2, setInsight2] = useState("");

            // --- 常规模式的自动计算 ---
            useEffect(() => {
                const bCredits = parseFloat(baseCredits);
                const bScore = parseFloat(baseScore);
                let termTotalPoints = 0;
                let termTotalCredits = 0;

                courses.forEach(course => {
                    const cCredit = parseFloat(course.credit);
                    const cScore = parseFloat(course.score);
                    if (!isNaN(cCredit) && !isNaN(cScore)) {
                        termTotalPoints += cCredit * cScore;
                        termTotalCredits += cCredit;
                    }
                });

                if (termTotalCredits > 0) setTermStats({ credits: termTotalCredits, avg: termTotalPoints / termTotalCredits });
                else setTermStats({ credits: 0, avg: 0 });

                if (isNaN(bCredits) || isNaN(bScore)) { setResult(null); return; }
                if (termTotalCredits === 0) { setResult(bScore.toFixed(4)); setDiff(0); return; }

                const finalAverage = (bCredits * bScore + termTotalPoints) / (bCredits + termTotalCredits);
                setResult(finalAverage.toFixed(4));
                setDiff(finalAverage - bScore);
            }, [baseCredits, baseScore, courses]);

            // 课程操作
            const addCourse = () => setCourses([...courses, { id: Date.now(), name: '', credit: '', score: '' }]);
            const removeCourse = (id) => courses.length === 1 ? setCourses([{ id: Date.now(), name: '', credit: '', score: '' }]) : setCourses(courses.filter(c => c.id !== id));
            const updateCourse = (id, field, value) => setCourses(courses.map(c => c.id === id ? { ...c, [field]: value } : c));
            const handleReset = () => setCourses([{ id: Date.now(), name: '', credit: '', score: '' }]);

            // --- 通用计算引擎 ---
            const calculateFinal = (bC_str, bS_str, tC_str, tS_str) => {
                const bC = parseFloat(bC_str), bS = parseFloat(bS_str);
                const tC = parseFloat(tC_str), tS = parseFloat(tS_str);
                if (isNaN(bC) || isNaN(bS)) return null;
                if (isNaN(tC) || isNaN(tS) || tC === 0) return bS.toFixed(4);
                return ((bC * bS + tC * tS) / (bC + tC)).toFixed(4);
            };

            const resultA = calculateFinal(baseCredits, baseScore, planA.credits, planA.score);
            const resultB = calculateFinal(baseCredits, baseScore, planB.credits, planB.score);
            const planDiff = (resultA !== null && resultB !== null) ? Math.abs(parseFloat(resultA) - parseFloat(resultB)).toFixed(4) : null;

            const myCompFinal = calculateFinal(baseCredits, baseScore, myTermData.credits, myTermData.score);
            const theirCompFinal = calculateFinal(compBaseCredits, compBaseScore, compTermData.credits, compTermData.score);
            const myCompDiff = (myCompFinal !== null && !isNaN(parseFloat(baseScore))) ? (myCompFinal - parseFloat(baseScore)).toFixed(4) : 0;
            const theirCompDiff = (theirCompFinal !== null && !isNaN(parseFloat(compBaseScore))) ? (theirCompFinal - parseFloat(compBaseScore)).toFixed(4) : 0;
            const compScoreGap = (myCompFinal !== null && theirCompFinal !== null) ? Math.abs(myCompFinal - theirCompFinal).toFixed(4) : '--.--';

            // --- 渲染图表逻辑 ---
            useEffect(() => {
                if (!showDynamicChart || !chartRef1.current || !chartRef2.current) return;

                const bC1 = parseFloat(baseCredits); const bS1 = parseFloat(baseScore);
                const tC1 = parseFloat(myTermData.credits); const tS1 = parseFloat(myTermData.score);
                const myFinalNum = parseFloat(myCompFinal);
                
                const bC2 = parseFloat(compBaseCredits); const bS2 = parseFloat(compBaseScore);

                // --- 图表1：如果对手与我学分相同 (tC2 = tC1)，求成绩交点 ---
                const labels1 = Array.from({length: 41}, (_, i) => 60 + i); // 成绩范围 60 到 100
                const dataMy1 = labels1.map(() => myFinalNum);
                const dataComp1 = labels1.map(x => (bC2 * bS2 + tC1 * x) / (bC2 + tC1));
                
                // 求解交点: F1 = (C2*S2 + c1*x) / (C2 + c1)  => x = (F1*(C2+c1) - C2*S2)/c1
                const intersectScore = (myFinalNum * (bC2 + tC1) - bC2 * bS2) / tC1;
                
                if (intersectScore > 100) setInsight1(`🚀 稳如泰山！对手即使选和你一样多的课，考出 100 分满分也无法追平你（所需分数: ${intersectScore.toFixed(2)}）。`);
                else if (intersectScore < 0) setInsight1(`⚠️ 悬崖勒马！对手的基础分优势太大，随便考个分也能赢你。`);
                else setInsight1(`🎯 破局关键点：在同等学分（${tC1}分）下，若对手本学期均分达到 ${intersectScore.toFixed(2)} 分，你们的总均分将完全打平！`);

                // --- 图表2：如果对手与我均分相同 (tS2 = tS1)，求学分交点 ---
                const labels2 = Array.from({length: 41}, (_, i) => i); // 学分范围 0 到 40
                const dataMy2 = labels2.map(() => myFinalNum);
                const dataComp2 = labels2.map(x => (bC2 * bS2 + x * tS1) / (bC2 + x));

                // 求解交点: F1 = (C2*S2 + x*s1) / (C2 + x) => x*(s1 - F1) = C2*(F1 - S2) => x = C2*(F1 - S2)/(s1 - F1)
                const intersectCredits = (bC2 * (myFinalNum - bS2)) / (tS1 - myFinalNum);
                
                if (!isFinite(intersectCredits) || Math.abs(tS1 - myFinalNum) < 0.0001) {
                    setInsight2("📉 特殊情况：你们的成绩曲线趋于平行，无法通过此方式产生有效交点。");
                } else if (intersectCredits < 0) {
                    setInsight2("🛑 无法通过“堆学分”追平。随着学分增加，你们的分差反而在拉大。");
                } else if (intersectCredits > 50) {
                    setInsight2(`🛡️ 安全距离：对手需要修满 ${intersectCredits.toFixed(1)} 学分才能追平，单学期内绝不可能发生！`);
                } else {
                    setInsight2(`🎯 破局关键点：在同等发挥水平（均分${tS1}）下，对手只需选满 ${intersectCredits.toFixed(1)} 学分，即可反超你！`);
                }

                // --- 销毁旧图表 ---
                if (window.myChartInstance1) window.myChartInstance1.destroy();
                if (window.myChartInstance2) window.myChartInstance2.destroy();

                const commonOptions = {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } } },
                    scales: {
                        y: { title: { display: true, text: '最终总加权均分' } },
                        x: { grid: { display: false } }
                    }
                };

                // --- 绘制图表1 ---
                window.myChartInstance1 = new Chart(chartRef1.current.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: labels1,
                        datasets: [
                            { label: '我的加权曲线', data: dataMy1, borderColor: '#4f46e5', backgroundColor: '#4f46e5', borderWidth: 2, pointRadius: 0, borderDash: [5, 5] },
                            { label: '对手加权曲线', data: dataComp1, borderColor: '#e11d48', backgroundColor: '#e11d48', borderWidth: 2, pointRadius: 2, tension: 0.1 }
                        ]
                    },
                    options: { ...commonOptions, scales: { ...commonOptions.scales, x: { ...commonOptions.scales.x, title: { display: true, text: '对手本学期可能的均分' } } } }
                });

                // --- 绘制图表2 ---
                window.myChartInstance2 = new Chart(chartRef2.current.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: labels2,
                        datasets: [
                            { label: '我的加权曲线', data: dataMy2, borderColor: '#4f46e5', backgroundColor: '#4f46e5', borderWidth: 2, pointRadius: 0, borderDash: [5, 5] },
                            { label: '对手加权曲线', data: dataComp2, borderColor: '#e11d48', backgroundColor: '#e11d48', borderWidth: 2, pointRadius: 2, tension: 0.3 }
                        ]
                    },
                    options: { ...commonOptions, scales: { ...commonOptions.scales, x: { ...commonOptions.scales.x, title: { display: true, text: '对手本学期可能的选课学分' } } } }
                });

            }, [showDynamicChart, baseCredits, baseScore, myTermData, compBaseCredits, compBaseScore]);

            // 判断动态图表按钮是否可用
            const canShowChart = myTermData.credits && myTermData.score && compBaseCredits && compBaseScore && !isNaN(myCompFinal);

            // --- 保存当前界面为 HTML 的功能 ---
            const handleDownload = () => {
                const htmlElement = document.documentElement.cloneNode(true);
                const rootElement = htmlElement.querySelector('#root');
                if (rootElement) rootElement.innerHTML = ''; // 清除已渲染的 DOM，避免下次加载冲突
                
                // 清理 Babel/Tailwind 动态注入的无用标签，减小体积并避免重复注入
                htmlElement.querySelectorAll('script').forEach(s => {
                    if (!s.src && s.type !== 'text/babel' && s.id !== 'saved-state') s.remove();
                });
                htmlElement.querySelectorAll('style').forEach(s => {
                    if (s.id !== 'custom-style') s.remove();
                });

                // 将当前所有输入数据打包
                const currentState = { baseCredits, baseScore, courses, planA, planB, compBaseCredits, compBaseScore, myTermData, compTermData };

                // 创建或更新保存状态的 script 标签
                let stateScript = htmlElement.querySelector('#saved-state');
                if (!stateScript) {
                    stateScript = document.createElement('script');
                    stateScript.id = 'saved-state';
                    htmlElement.querySelector('head').appendChild(stateScript);
                }
                stateScript.textContent = `window.__SAVED_STATE__ = ${JSON.stringify(currentState)};`;

                // 触发下载
                const htmlContent = "<!DOCTYPE html>\n" + htmlElement.outerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '我的GPA智能助手.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            return (
                <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 font-sans text-slate-800">
                <div className={`w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 flex flex-col max-h-[95vh] relative transition-all duration-500 ${mode !== 'regular' ? 'max-w-4xl' : 'max-w-md'}`}>
                    
                    {/* 头部 */}
                    <div className="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white shrink-0 shadow-md z-10 relative">
                        <div className="flex items-center space-x-3 mb-2">
                            <GraduationCap className="w-8 h-8" />
                            <h1 className="text-2xl font-bold">GPA 智能助手</h1>
                        </div>
                        <p className="text-blue-100 opacity-90 text-sm">
                            {mode === 'regular' && '日常学业成绩与加权管理'}
                            {mode === 'plan' && '个人学业规划与选课对比'}
                            {mode === 'competitor' && '多维度竞争对手学业博弈'}
                        </p>

                        {/* 下载/保存按钮 */}
                        <button 
                            onClick={handleDownload}
                            className="absolute top-6 right-6 p-2 bg-white/10 hover:bg-white/25 rounded-full transition-all duration-300 backdrop-blur-sm group"
                            title="保存当前界面与数据为离线 HTML"
                        >
                            <Download className="w-5 h-5 text-white group-hover:scale-110 transition-transform" />
                        </button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar relative">
                        
                        {/* 基础数据 (常规/方案对比模式下显示) */}
                        {mode !== 'competitor' && (
                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <div className="flex items-center justify-between mb-3">
                                    <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider">历史成绩基数</h2>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">已修总学分</label>
                                        <input
                                            type="number" value={baseCredits} onChange={(e) => setBaseCredits(e.target.value)} onWheel={(e) => e.target.blur()}
                                            className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 font-medium text-sm transition-shadow" placeholder="0"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">当前加权均分</label>
                                        <input
                                            type="number" value={baseScore} onChange={(e) => setBaseScore(e.target.value)} onWheel={(e) => e.target.blur()}
                                            className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 font-medium text-sm transition-shadow" placeholder="0.00"
                                        />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- 模式 1: 常规计算列表 --- */}
                        {mode === 'regular' && (
                            <div className="animate-in fade-in duration-300">
                                <div className="flex items-center justify-between mb-3">
                                    <h2 className="text-sm font-semibold text-indigo-600 uppercase tracking-wider flex items-center gap-2">
                                        <Calculator className="w-4 h-4" /> 本学期课程
                                    </h2>
                                    <button onClick={handleReset} className="text-xs flex items-center gap-1 text-slate-400 hover:text-red-500 transition-colors">

                                        <p className="text-sm text-slate-500 mb-4">如果对手这学期能保持和你一样的均分水平，他需要多修多少个学分才能凭借量变引起质变？</p>
                                        
                                        <div className="h-64 w-full bg-white rounded-lg border border-slate-200 p-2 mb-4">
                                            <canvas ref={chartRef2}></canvas>
                                        </div>
                                        
                                        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-amber-800 text-sm font-medium">
                                            {insight2}
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    )}

                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
